<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Pepsico Funza</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 40px; }
        .logo-container { position: absolute; top: 50px; left: 50px; }
        .logo-container img { width: 200px; height: auto; }
        form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.2); width: 500px; margin: auto; }
        .registro-vehiculo { border: 2px solid #C76E00; padding: 15px; margin-top: 20px; border-radius: 10px; position: relative; }
        .parada-group { border: 1px dashed #ced4da; padding: 10px; margin-top: 15px; border-radius: 5px; }
        .form-group-custom { margin-top: 15px; display: flex; flex-direction: column; }
        .btn-agregar-registro, .btn-agregar-parada-op { background-color: #001855; color: white; border: none; cursor: pointer; margin-top: 15px; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; }
        .btn-agregar-registro:hover, .btn-agregar-parada-op:hover { background-color: #0056b3; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 8px; margin-top: 8px; border-radius: 8px; border: 1px solid #170303; }
        .time-row { display: flex; gap: 10px; align-items: flex-start; }
        .time-display { display: block; margin-top: 5px; font-size: 0.85em; color: #155724; font-weight: bold; }
        .time-label { font-weight: bold; display: block; margin-top: 5px; color: #007bff; }
        button[type="submit"] { background-color: #001855; color: white; border: none; cursor: pointer; margin-top: 20px; font-weight: bold; font-size: 1.1em; }
        .time-input-masked { text-align: center; font-size: 1.1em; letter-spacing: 2px; }
        .btn-eliminar-registro { position: absolute; top: 10px; right: 10px; background-color: #8B0000; color: white; border: none; padding: 5px 10px; cursor: pointer; font-size: 0.8em; border-radius: 5px; }
        .btn-eliminar-parada { background-color: #8B0000; color: white; border: none; padding: 5px; margin-top: 10px; cursor: pointer; border-radius: 5px; }
        .otro-input { margin-top:5px; display:none; }
        .preview-foto img { max-width: 100%; max-height: 200px; border: 1px solid #ddd; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="prueba.png" alt="Logo"> 
    </div>
    <h2 style="text-align:center;">FORMULARIO - PEPSICO FUNZA</h2>

    <form name="formulario-pepsico" method="POST" data-netlify="true" id="miFormulario">
        <input type="hidden" name="form-name" value="formulario-pepsico" />

        <label for="lugar">Lugar de operación:</label>
        <select name="lugar" id="lugar" required onchange="actualizarCampos()">
            <option value="">Seleccione una opción</option>
            <option value="Funza">Pepsico Funza</option>
        </select>

        <label for="lider">Líder Asignado:</label>
        <input type="text" name="lider_asignado" id="lider" required placeholder="Nombre y Apellido">

        <label for="coordinador">Coordinador Asignado:</label>
        <input type="text" name="coordinador" id="coordinador" readonly required>

        <label for="lider_pepsico">Líder De Pepsico:</label>
        <select name="lider_pepsico" id="lider_pepsico" required>
            <option value="">Seleccione</option>
            <option value="Alejandro Ariza">Alejandro Ariza</option>
            <option value="Alejandro Monroy">Alejandro Monroy</option>
            <option value="Carlos Ruiz">Carlos Ruiz</option>
        </select>

        <label for="fecha">Fecha:</label>
        <input type="date" name="fecha" id="fecha" required>

        <label for="turno">Turno Asignado:</label>
        <select name="turno" id="turno" required>
            <option value="">Seleccione</option>
            <option value="Manana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
        </select>

        <div id="vehiculos-contenedor"></div>
        <button type="button" class="btn-agregar-registro" onclick="agregarRegistroVehiculo()">+ Registrar Nuevo Vehículo</button>

        <div id="operacion-contenedor"></div>
        <button type="button" class="btn-agregar-parada-op" onclick="agregarCampoParada()">+ Agregar Parada de Operación</button>

        <label for="total_personas">Total Personas En El Turno:</label>
        <input type="number" name="total_personas" id="total_personas" min="1" required>

        <label for="cajas_totales">Total Cajas Movidas:</label>
        <input type="number" name="cajas_totales" id="cajas_totales" readonly>
        
        <input type="hidden" name="datos_vehiculos" id="datos_vehiculos">
        <input type="hidden" name="datos_paradas_operacion" id="datos_paradas_operacion">

        <button type="submit">Enviar Formulario</button>
    </form>

    <script>
        // --- UTILIDADES ---
        function horaAMinutos(hStr) {
            if(!hStr || !hStr.includes(':')) return null;
            const [h, m] = hStr.split(':').map(Number);
            return h * 60 + m;
        }

        function rangosSeSolapan(i1, f1, i2, f2) {
            const inicio1 = horaAMinutos(i1), fin1 = horaAMinutos(f1);
            const inicio2 = horaAMinutos(i2), fin2 = horaAMinutos(f2);
            if (inicio1 === null || fin1 === null || inicio2 === null || fin2 === null) return false;
            return inicio1 < fin2 && inicio2 < fin1;
        }

        function applyTimeMask(input, displayId) {
            let v = input.value.replace(/\D/g, '');
            if (v.length >= 4) {
                v = v.substring(0, 4);
                input.value = v.substring(0, 2) + ":" + v.substring(2, 4);
            }
        }

        function manejarOtro(select) {
            const otro = select.nextElementSibling;
            if(otro && otro.classList.contains('otro-input')) {
                otro.style.display = select.value === 'otro' ? 'block' : 'none';
            }
        }

        // --- GESTIÓN DE VEHÍCULOS ---
        let vCounter = 0;
        function agregarRegistroVehiculo() {
            const container = document.getElementById('vehiculos-contenedor');
            const idx = vCounter++;
            const div = document.createElement('div');
            div.className = 'registro-vehiculo';
            div.dataset.index = idx;
            div.innerHTML = `
                <button type="button" class="btn-eliminar-registro" onclick="this.parentElement.remove(); actualizarTotalCajas();">Eliminar #</button>
                <h4 style="color:#C76E00; text-align:center;">VEHÍCULO</h4>
                <div class="time-row">
                    <div>
                        <label>Hora Inicio:</label>
                        <input type="tel" name="v_ini_${idx}" class="time-input-masked" placeholder="HH:MM" onblur="applyTimeMask(this)">
                    </div>
                    <div>
                        <label>Hora Fin:</label>
                        <input type="tel" name="v_fin_${idx}" class="time-input-masked" placeholder="HH:MM" onblur="applyTimeMask(this)">
                    </div>
                </div>
                <label>Placa:</label>
                <input type="text" name="v_placa_${idx}" id="placa_${idx}" required maxlength="6" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
                <label>Muelle:</label>
                <select name="v_muelle_${idx}" onchange="manejarOtro(this)">
                    <option value="3">3</option><option value="11">11</option><option value="12">12</option><option value="otro">Otro</option>
                </select>
                <input type="number" name="v_otro_m_${idx}" class="otro-input" placeholder="N° Muelle">
                <label>Cajas:</label>
                <input type="number" name="v_cajas_${idx}" class="cajas-input-js" oninput="actualizarTotalCajas()">
                <label>Foto:</label>
                <input type="file" id="foto_file_${idx}" accept="image/*" capture="environment" onchange="subirFoto(${idx})">
                <input type="hidden" name="v_url_${idx}" id="url_${idx}">
                <div id="prev_${idx}" class="preview-foto"></div>
            `;
            container.appendChild(div);
        }

        // --- GESTIÓN DE PARADAS ---
        let pCounter = 0;
        function agregarCampoParada() {
            const container = document.getElementById('operacion-contenedor');
            const idx = pCounter++;
            const div = document.createElement('div');
            div.className = 'parada-group';
            div.innerHTML = `
                <label>Parada de Operación</label>
                <div class="time-row">
                    <input type="tel" name="p_ini_${idx}" class="time-input-masked" placeholder="Inicio HH:MM" onblur="applyTimeMask(this)">
                    <input type="tel" name="p_fin_${idx}" class="time-input-masked" placeholder="Fin HH:MM" onblur="applyTimeMask(this)">
                </div>
                <select name="p_motivo_${idx}" onchange="manejarOtro(this)">
                    <option value="aseo">Aseo</option>
                    <option value="pausas">Pausas Activas</option>
                    <option value="otro">Otro</option>
                </select>
                <input type="text" name="p_otro_m_${idx}" class="otro-input" placeholder="Especifique">
                <button type="button" class="btn-eliminar-parada" onclick="this.parentElement.remove()">Eliminar Parada</button>
            `;
            container.appendChild(div);
        }

        // --- SUBIDA DE FOTOS (NOMBRE POR PLACA) ---
        async function subirFoto(idx) {
            const file = document.getElementById(`foto_file_${idx}`).files[0];
            const placa = document.getElementById(`placa_${idx}`).value || 'SIN_PLACA';
            const fecha = document.getElementById('fecha').value.split('-').reverse().join('.') || '00.00.0000';
            const preview = document.getElementById(`prev_${idx}`);
            
            if(!file) return;
            preview.innerHTML = "Subiendo...";

            const formData = new FormData();
            formData.append('image', file);
            formData.append('key', '7aa1cd8e8d0a3558833f225cbeba96ac');
            formData.append('name', `${fecha}.${placa}.vehiculo_${idx}`);

            try {
                const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    document.getElementById(`url_${idx}`).value = data.data.url;
                    preview.innerHTML = `<img src="${data.data.url}"><p>✅ Subida</p>`;
                }
            } catch(e) { alert("Error al subir foto"); }
        }

        function actualizarTotalCajas() {
            let total = 0;
            document.querySelectorAll('.cajas-input-js').forEach(i => total += parseInt(i.value || 0));
            document.getElementById('cajas_totales').value = total;
        }

        function actualizarCampos() {
            if(document.getElementById('lugar').value === 'Funza') {
                document.getElementById('coordinador').value = "Jeison Aranda";
                document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
            }
        }

        // --- LÓGICA DE ENVÍO FINAL (CORRECCIÓN DE DATOS VACÍOS) ---
        document.getElementById('miFormulario').addEventListener('submit', function(e) {
            const vehiculosArr = [];
            const paradasArr = [];

            // Recolectar Vehículos
            document.querySelectorAll('.registro-vehiculo').forEach(reg => {
                const i = reg.dataset.index;
                const muelleVal = reg.querySelector(`[name="v_muelle_${i}"]`).value;
                vehiculosArr.push({
                    inicio: reg.querySelector(`[name="v_ini_${i}"]`).value,
                    fin: reg.querySelector(`[name="v_fin_${i}"]`).value,
                    placa: reg.querySelector(`[name="v_placa_${i}"]`).value,
                    muelle: muelleVal === 'otro' ? reg.querySelector(`[name="v_otro_m_${i}"]`).value : muelleVal,
                    cajas: reg.querySelector(`[name="v_cajas_${i}"]`).value,
                    foto: reg.querySelector(`#url_${i}`).value
                });
            });

            // Recolectar Paradas
            document.querySelectorAll('.parada-group').forEach(p => {
                const ini = p.querySelector('input[name^="p_ini"]').value;
                const fin = p.querySelector('input[name^="p_fin"]').value;
                const mot = p.querySelector('select[name^="p_motivo"]').value;
                if(ini && fin) {
                    paradasArr.push({ inicio: ini, fin: fin, motivo: mot });
                }
            });

            // Validar Solapamientos (Ejemplo Muelles)
            for(let a=0; a<vehiculosArr.length; a++) {
                for(let b=a+1; b<vehiculosArr.length; b++) {
                    if(vehiculosArr[a].muelle === vehiculosArr[b].muelle && 
                       rangosSeSolapan(vehiculosArr[a].inicio, vehiculosArr[a].fin, vehiculosArr[b].inicio, vehiculosArr[b].fin)) {
                        alert(`¡Conflicto de horario en muelle ${vehiculosArr[a].muelle}!`);
                        e.preventDefault();
                        return;
                    }
                }
            }

            // Asignar a campos ocultos antes de enviar
            document.getElementById('datos_vehiculos').value = JSON.stringify(vehiculosArr);
            document.getElementById('datos_paradas_operacion').value = JSON.stringify(paradasArr);
            
            // Convertir textos a Mayúsculas
            document.querySelectorAll('input[type="text"]').forEach(input => {
                input.value = input.value.toUpperCase();
            });
        });

        // Iniciar con un registro
        document.addEventListener('DOMContentLoaded', () => {
            agregarRegistroVehiculo();
            agregarCampoParada();
        });
    </script>
</body>
</html>
