<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Pepsico Funza</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f8f9fa;
  padding: 40px;
}
.logo-container {
  position: absolute;
  top: 50px;
  left: 50px;
}
.logo-container img {
  width: 200px;
  height: auto;
}
form {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  width: 500px;
  margin: auto;
}
.registro-vehiculo {
  border: 2px solid #C76E00;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
  position: relative;
}
.parada-group {
  border: 1px dashed #ced4da;
  padding: 10px;
  margin-top: 15px;
  border-radius: 5px;
}
.form-group-custom {
  margin-top: 15px;
  display: flex;
  flex-direction: column;
}
.btn-agregar-registro,
.btn-agregar-parada-op {
  background-color: #001855;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
}
.btn-agregar-registro:hover,
.btn-agregar-parada-op:hover {
  background-color: #0056b3;
}
label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
}
select, input, button {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  border-radius: 8px;
  border: 1px solid #170303;
}
.time-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.time-row > div {
  flex-grow: 1;
  position: relative;
}
.time-display {
  display: block;
  margin-top: 5px;
  font-size: 0.85em;
  color: #155724;
  font-weight: bold;
}
.time-label {
  font-weight: bold;
  display: block;
  margin-top: 5px;
  color: #007bff;
}
button[type="submit"] {
  background-color: #001855;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 20px;
}
button[type="submit"]:hover {
  background-color: #0056b3;
}
.time-input-masked {
  text-align: center;
  font-size: 1.1em;
  letter-spacing: 2px;
}
.btn-eliminar {
  background-color:#8B0000 !important;
  width:auto !important;
  padding:5px 10px !important;
  margin-top:10px !important;
  border: none !important;
  color: white !important;
}
.btn-eliminar-registro {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: #8B0000 !important;
  color: white !important;
  border: none !important;
  padding: 5px 10px !important;
  cursor: pointer;
  font-size: 0.8em;
  width: auto;
}
.btn-eliminar:hover {
  background-color:#c82333 !important;
}
.otro-input {
  margin-top:5px;
  display:none;
}
.preview-foto img {
  max-width: 100%;
  max-height: 200px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 8px;
}
.btn-borrar-todo {
  background-color: #8B0000;
  color: white;
  margin-top: 20px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="logo-container">
  <img src="prueba.png" alt="Logo de la Empresa">
</div>
<h2 style="text-align:center;">FORMULARIO - PEPSICO FUNZA</h2>
<form name="formulario-pepsico" method="POST" data-netlify="true">
  <input type="hidden" name="form-name" value="formulario-pepsico" />
  
  <label for="lugar">Lugar de operación:</label>
  <select name="lugar" id="lugar" required onchange="actualizarCampos()">
    <option value="">Seleccione una opción</option>
    <option value="Funza">Pepsico Funza</option>
  </select>
  
  <label for="lider">Líder Asignado:</label>
  <input type="text" name="lider_asignado" id="lider" required placeholder="Primer Nombre y Primer Apellido">
  
  <label for="coordinador">Coordinador Asignado:</label>
  <select name="coordinador" id="coordinador" required onchange="manejarOtroCoordinador()">
    <option value="">Seleccione coordinador</option>
    <option value="Jeison Aranda">Jeison Aranda</option>
    <option value="Julian Espitia">Julian Espitia</option>
    <option value="otro">Otro</option>
  </select>
  <input type="text" name="coordinador_otro" id="coordinador_otro" class="otro-input" placeholder="Especifique el coordinador">
  
  <label for="lider_pepsico">Líder De Pepsico:</label>
  <select name="lider_pepsico" id="lider_pepsico" required>
    <option value="">Seleccione un líder</option>
    <option value="Alejandro Ariza">Alejandro Ariza</option>
    <option value="Alejandro Monroy">Alejandro Monroy</option>
    <option value="Carlos Ruiz">Carlos Ruiz</option>
  </select>
  
  <label for="fecha">Fecha:</label>
  <input type="date" name="fecha" id="fecha" required>
  
  <label for="turno">Turno Asignado:</label>
  <select name="turno" id="turno" required>
    <option value="">Seleccione un turno</option>
    <option value="Manana">Mañana</option>
    <option value="Tarde">Tarde</option>
    <option value="Noche">Noche</option>
  </select>

  <hr style="margin-top: 25px; border-style: dotted;">
  <h3 style="text-align:center; font-size:1.3em; color:#C76E00;">REGISTRO DE VEHÍCULOS</h3>
  <div id="vehiculos-contenedor"></div>
  <button type="button" class="btn-agregar-registro" onclick="agregarRegistroVehiculo()">
    + Registrar Nuevo Vehículo
  </button>

  <hr style="margin-top: 25px; border-style: dotted;">
  <h3 style="text-align:center; font-size:1.3em; color:#001855;">PARADAS DE OPERACIÓN</h3>
  <div id="operacion-contenedor"></div>
  <button type="button" class="btn-agregar-parada-op" onclick="agregarCampoParada('operacion')">
    + Agregar Parada
  </button>

  <hr style="margin-top: 25px; border-style: dotted;">
  <h3 style="text-align:center; font-size:1.1em; color:#296097;">TOTALES DE TURNO</h3>
  <label for="total_personas">Total Personas En El Turno:</label>
  <input type="number" name="total_personas" id="total_personas" min="1" required placeholder="Total de empleados en el turno">
  
  <label for="cajas_totales">Total Cajas Movidas:</label>
  <input type="number" name="cajas_totales" id="cajas_totales" min="0" required placeholder="Cantidad total de cajas movidas" oninput="actualizarTotalCajas()">

  <input type="hidden" name="datos_vehiculos" id="datos_vehiculos" value="">
  <input type="hidden" name="datos_paradas_operacion" id="datos_paradas_operacion" value="">

  <div style="display: flex; gap: 10px;">
    <button type="submit" style="flex: 3;">Enviar</button>
    <button type="button" class="btn-borrar-todo" style="flex: 1;" onclick="limpiarTodo()">Borrar Todo</button>
  </div>
</form>

<script>
let vehiculosData = [];

function horaAMinutos(horaStr) {
  if (!horaStr || !horaStr.includes(':')) return null;
  const [h, m] = horaStr.split(':').map(Number);
  if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
  return h * 60 + m;
}

function rangosSeSolapan(inicio1, fin1, inicio2, fin2) {
  const i1 = horaAMinutos(inicio1);
  const f1 = horaAMinutos(fin1);
  const i2 = horaAMinutos(inicio2);
  const f2 = horaAMinutos(fin2);
  if (i1 === null || f1 === null || i2 === null || f2 === null) return false;
  return i1 < f2 && i2 < f1;
}

function validarSolapamientoVehiculos() {
  const agrupados = {};
  for (let idx = 0; idx < vehiculosData.length; idx++) {
    const data = vehiculosData[idx];
    if (!data.muelle && data.muelle !== 'otro') continue;
    const muelle = data.muelle === 'otro' ? (data.otro_muelle_num || '') : data.muelle;
    if (!muelle || !data.inicio || !data.fin) continue;
    if (!agrupados[muelle]) agrupados[muelle] = [];
    agrupados[muelle].push({ inicio: data.inicio, fin: data.fin, idx });
  }
  for (const muelle in agrupados) {
    const regs = agrupados[muelle];
    for (let i = 0; i < regs.length; i++) {
      for (let j = i + 1; j < regs.length; j++) {
        if (rangosSeSolapan(regs[i].inicio, regs[i].fin, regs[j].inicio, regs[j].fin)) {
          alert(`¡Conflicto en muelle ${muelle}! Los vehículos #${regs[i].idx + 1} y #${regs[j].idx + 1} se superponen en el tiempo.`);
          return false;
        }
      }
    }
  }
  return true;
}

function validarSolapamientoParadas() {
  const paradas = [];
  const cont = document.getElementById('operacion-contenedor');
  const grupos = cont.querySelectorAll('.parada-group');
  grupos.forEach((grupo, idx) => {
    const inicio = grupo.querySelector(`input[name="parada_inicio_operacion_${grupo.dataset.index}"]`).value;
    const fin = grupo.querySelector(`input[name="parada_fin_operacion_${grupo.dataset.index}"]`).value;
    if (inicio && fin) paradas.push({ inicio, fin, idx });
  });
  for (let i = 0; i < paradas.length; i++) {
    for (let j = i + 1; j < paradas.length; j++) {
      if (rangosSeSolapan(paradas[i].inicio, paradas[i].fin, paradas[j].inicio, paradas[j].fin)) {
        alert(`¡Las paradas de operación #${i + 1} y #${j + 1} se superponen en el tiempo!`);
        return false;
      }
    }
  }
  return true;
}

function eliminarRegistroVehiculo(index) {
  if (vehiculosData.length <= 1) {
    alert("Debe haber al menos un vehículo registrado.");
    return;
  }
  sincronizarVehiculosDesdeDOM();
  vehiculosData.splice(index, 1);
  reindexarVehiculos();
  actualizarTotalCajas();
  guardarProgreso();
}

function reindexarVehiculos() {
  const contenedor = document.getElementById('vehiculos-contenedor');
  contenedor.innerHTML = '';
  for (let i = 0; i < vehiculosData.length; i++) {
    crearVehiculoHTML(contenedor, i, vehiculosData[i]);
  }
}

function agregarRegistroVehiculo() {
  const vIndex = vehiculosData.length;
  vehiculosData.push({});
  const contenedor = document.getElementById('vehiculos-contenedor');
  crearVehiculoHTML(contenedor, vIndex, {});
  actualizarTotalCajas();
  guardarProgreso();
}

function sincronizarVehiculosDesdeDOM() {
  const contenedor = document.getElementById('vehiculos-contenedor');
  const registros = contenedor.querySelectorAll('.registro-vehiculo');
  for (let i = 0; i < registros.length; i++) {
    const reg = registros[i];
    if (vehiculosData[i] === undefined) vehiculosData[i] = {};
    const getValue = name => {
      const el = reg.querySelector(`[name="${name}"]`);
      return el ? el.value || '' : '';
    };
    vehiculosData[i] = {
      inicio: getValue(`vehiculo_${i}_inicio`),
      fin: getValue(`vehiculo_${i}_fin`),
      motivo: getValue(`vehiculo_${i}_motivo`),
      otro_motivo: getValue(`vehiculo_${i}_otro_motivo`),
      muelle: getValue(`vehiculo_${i}_muelle`),
      otro_muelle_num: getValue(`vehiculo_${i}_otro_muelle_num`),
      placa: getValue(`vehiculo_${i}_placa`),
      tipo_vehi: getValue(`vehiculo_${i}_tipo_vehi`),
      otro_tipo: getValue(`vehiculo_${i}_otro_tipo`),
      destino: getValue(`vehiculo_${i}_destino`),
      otro_destino: getValue(`vehiculo_${i}_otro_destino`),
      origen: getValue(`vehiculo_${i}_origen`),
      personas: getValue(`vehiculo_${i}_personas`),
      cajas: getValue(`vehiculo_${i}_cajas`),
      justificacion: getValue(`vehiculo_${i}_justificacion`),
      otro_justificacion: getValue(`vehiculo_${i}_otro_justificacion`),
      tiempo_muerto_inicio: getValue(`vehiculo_${i}_tiempo_muerto_inicio`),
      tiempo_muerto_final: getValue(`vehiculo_${i}_tiempo_muerto_final`),
      foto_url: getValue(`vehiculo_${i}_foto_url`)
    };
  }
}

function manejarOtroCampo(select) {
  const otro = select.nextElementSibling;
  if (!otro || !otro.classList.contains('otro-input')) return;
  if (select.value === 'otro') {
    otro.style.display = 'block';
    otro.required = true;
  } else {
    otro.style.display = 'none';
    otro.required = false;
    otro.value = '';
  }
  guardarProgreso();
}

function manejarOtroCoordinador() {
  const s = document.getElementById('coordinador');
  const o = document.getElementById('coordinador_otro');
  if (s.value === 'otro') {
    o.style.display = 'block';
    o.required = true;
  } else {
    o.style.display = 'none';
    o.required = false;
    o.value = '';
  }
  guardarProgreso();
}

function alternarDestinoRemitente(selectMotivo, vIndex) {
  const motivo = selectMotivo.value;
  const dGroup = document.getElementById(`destino-group-${vIndex}`);
  const rGroup = document.getElementById(`remitente-group-${vIndex}`);
  if (dGroup) dGroup.style.display = (motivo === 'cargue') ? 'block' : 'none';
  if (rGroup) rGroup.style.display = (motivo === 'descargue') ? 'block' : 'none';
  const dSelect = document.getElementById(`destino-select-${vIndex}`);
  const rInput = document.getElementById(`remitente-input-${vIndex}`);
  if (motivo === 'cargue' && dSelect) dSelect.setAttribute('required', 'required');
  else if (rInput) rInput.required = (motivo === 'descargue');
}

function mostrarTiempoMuerto(select, vIndex) {
  const div = document.getElementById(`tiempo-muerto-${vIndex}`);
  if (select.value !== "") {
    div.style.display = 'flex';
  } else {
    div.style.display = 'none';
    const ini = document.querySelector(`input[name="vehiculo_${vIndex}_tiempo_muerto_inicio"]`);
    const fin = document.querySelector(`input[name="vehiculo_${vIndex}_tiempo_muerto_final"]`);
    if (ini) ini.value = '';
    if (fin) fin.value = '';
  }
  guardarProgreso();
}

function crearVehiculoHTML(contenedor, vIndex, datos = {}) {
  const inicioId = `cargue-inicio-${vIndex}`;
  const finId = `cargue-fin-${vIndex}`;
  const fotoInputId = `foto_vehiculo_${vIndex}`;
  const previewFotoId = `preview_foto_${vIndex}`;
  const motivoSelectId = `motivo-cargue-descargue-${vIndex}`;

  const registro = document.createElement('div');
  registro.className = 'registro-vehiculo';
  registro.dataset.index = vIndex;

  registro.innerHTML = `
    <button type="button" class="btn-eliminar-registro" onclick="eliminarRegistroVehiculo(${vIndex})">Eliminar Vehículo #${vIndex + 1}</button>
    <h4 style="text-align:center; color:#C76E00;">VEHÍCULO #${vIndex + 1}</h4>
    <div class="parada-group">
      <p style="font-weight:bold; margin-top:0; color:#555;">🛑 Parada #1 (Cargue/Descargue)</p>
      <div class="time-row">
        <div>
          <label class="time-label">Hora Inicio:</label>
          <input type="tel" name="vehiculo_${vIndex}_inicio" class="time-input-masked" required placeholder="HH:MM" maxlength="5" value="${datos.inicio || ''}" onblur="applyTimeMask(this, '${inicioId}');">
          <span id="${inicioId}" class="time-display"></span>
        </div>
        <div>
          <label class="time-label">Hora Final:</label>
          <input type="tel" name="vehiculo_${vIndex}_fin" class="time-input-masked" required placeholder="HH:MM" maxlength="5" value="${datos.fin || ''}" onblur="applyTimeMask(this, '${finId}');">
          <span id="${finId}" class="time-display"></span>
        </div>
      </div>
      <label style="margin-top:5px;">Motivo:</label>
      <select id="${motivoSelectId}" name="vehiculo_${vIndex}_motivo" required>
        <option value="">Seleccione</option>
        <option value="cargue" ${datos.motivo === 'cargue' ? 'selected' : ''}>Cargue</option>
        <option value="descargue" ${datos.motivo === 'descargue' ? 'selected' : ''}>Descargue</option>
        <option value="otro" ${datos.motivo === 'otro' ? 'selected' : ''}>Otro</option>
      </select>
      <input type="text" name="vehiculo_${vIndex}_otro_motivo" class="otro-input" placeholder="Especifique" value="${datos.otro_motivo || ''}">
    </div>
    <label>Muelle:</label>
    <select name="vehiculo_${vIndex}_muelle" required>
      <option value="">Seleccione</option>
      ${[3,11,12,13,14,17,18,19,20].map(m => `<option value="${m}" ${datos.muelle == m ? 'selected' : ''}>${m}</option>`).join('')}
      <option value="otro" ${datos.muelle === 'otro' ? 'selected' : ''}>Otro</option>
    </select>
    <input type="number" name="vehiculo_${vIndex}_otro_muelle_num" class="otro-input" placeholder="N° muelle" value="${datos.otro_muelle_num || ''}">
    <label>Placa:</label>
    <input type="text" name="vehiculo_${vIndex}_placa" required placeholder="Ej: ABC123" maxlength="6" value="${datos.placa || ''}" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); guardarProgreso();">
    <label>Tipo Vehículo:</label>
    <select name="vehiculo_${vIndex}_tipo_vehi" required>
      <option value="">Seleccione</option>
      <option value="Van extralargo" ${datos.tipo_vehi === 'Van extralargo' ? 'selected' : ''}>Van extralargo</option>
      <option value="Camion sencillo furgonado" ${datos.tipo_vehi === 'Camion sencillo furgonado' ? 'selected' : ''}>Camión sencillo furgonado</option>
      <option value="Camabaja furgonado" ${datos.tipo_vehi === 'Camabaja furgonado' ? 'selected' : ''}>Camabaja furgonado</option>
      <option value="Tractomula furgonado" ${datos.tipo_vehi === 'Tractomula furgonado' ? 'selected' : ''}>Tractomula furgonado</option>
      <option value="Exportacion 35" ${datos.tipo_vehi === 'Exportacion 35' ? 'selected' : ''}>Exportacion 35</option>
      <option value="Exportacion 40" ${datos.tipo_vehi === 'Exportacion 40' ? 'selected' : ''}>Exportacion 40</option>
      <option value="Cama baja con topes" ${datos.tipo_vehi === 'Cama baja con topes' ? 'selected' : ''}>Cama baja con topes</option>
      <option value="Camion sencillo carpado" ${datos.tipo_vehi === 'Camion sencillo carpado' ? 'selected' : ''}>Camión Sencillo Carpado</option>
      <option value="Camabaja estandar" ${datos.tipo_vehi === 'Camabaja estandar' ? 'selected' : ''}>Camabaja estandar</option>
      <option value="otro" ${datos.tipo_vehi === 'otro' ? 'selected' : ''}>Otro</option>
    </select>
    <input type="text" name="vehiculo_${vIndex}_otro_tipo" class="otro-input" value="${datos.otro_tipo || ''}">
    <div class="form-group-custom" id="destino-group-${vIndex}" style="${datos.motivo === 'cargue' ? 'block' : 'none'}">
      <label>Destino:</label>
      <select id="destino-select-${vIndex}" name="vehiculo_${vIndex}_destino">
        <option value="">Seleccione</option>
        <option value="guarner_medellin" ${datos.destino === 'guarner_medellin' ? 'selected' : ''}>Guarne/Medellin</option>
        <option value="cali" ${datos.destino === 'cali' ? 'selected' : ''}>Cali</option>
        <option value="barranquilla" ${datos.destino === 'barranquilla' ? 'selected' : ''}>Barranquilla</option>
        <option value="pereira" ${datos.destino === 'pereira' ? 'selected' : ''}>Pereira</option>
        <option value="bucaramanga" ${datos.destino === 'bucaramanga' ? 'selected' : ''}>Bucaramanga</option>
        <option value="monteria" ${datos.destino === 'monteria' ? 'selected' : ''}>Montería</option>
        <option value="peru" ${datos.destino === 'peru' ? 'selected' : ''}>Perú</option>
        <option value="otro" ${datos.destino === 'otro' ? 'selected' : ''}>Otro</option>
      </select>
      <input type="text" name="vehiculo_${vIndex}_otro_destino" class="otro-input" value="${datos.otro_destino || ''}">
    </div>
    <div class="form-group-custom" id="remitente-group-${vIndex}" style="${datos.motivo === 'descargue' ? 'block' : 'none'}">
      <label>Origen / Remitente:</label>
      <input type="text" id="remitente-input-${vIndex}" name="vehiculo_${vIndex}_origen" value="${datos.origen || ''}">
    </div>
    <label>Total Personas:</label>
    <input type="number" name="vehiculo_${vIndex}_personas" min="1" required value="${datos.personas || ''}">
    <label>Cajas Movidas:</label>
    <input type="number" name="vehiculo_${vIndex}_cajas" class="cajas-input-js" min="0" required value="${datos.cajas || ''}" oninput="actualizarTotalCajas(); guardarProgreso();">
    <label>Justificación incidencia:</label>
    <select name="vehiculo_${vIndex}_justificacion" onchange="mostrarTiempoMuerto(this, ${vIndex})">
      <option value="">Seleccione motivo</option>
      <option value="faltante_producto" ${datos.justificacion === 'faltante_producto' ? 'selected' : ''}>Faltante de producto</option>
      <option value="otro" ${datos.justificacion === 'otro' ? 'selected' : ''}>Otro</option>
    </select>
    <input type="text" name="vehiculo_${vIndex}_otro_justificacion" class="otro-input" value="${datos.otro_justificacion || ''}">
    <div class="time-row" id="tiempo-muerto-${vIndex}" style="display:${datos.justificacion ? 'flex' : 'none'};">
      <div>
        <label class="time-label">T. Muerto Inicio:</label>
        <input type="tel" name="vehiculo_${vIndex}_tiempo_muerto_inicio" class="time-input-masked" placeholder="HH:MM" maxlength="5" value="${datos.tiempo_muerto_inicio || ''}" onblur="applyTimeMask(this, 'muerto-inicio-${vIndex}');">
        <span id="muerto-inicio-${vIndex}" class="time-display"></span>
      </div>
      <div>
        <label class="time-label">T. Muerto Final:</label>
        <input type="tel" name="vehiculo_${vIndex}_tiempo_muerto_final" class="time-input-masked" placeholder="HH:MM" maxlength="5" value="${datos.tiempo_muerto_final || ''}" onblur="applyTimeMask(this, 'muerto-final-${vIndex}');">
        <span id="muerto-final-${vIndex}" class="time-display"></span>
      </div>
    </div>
    <label>Foto:</label>
    <input type="file" id="${fotoInputId}" accept="image/*" capture="environment">
    <div class="preview-foto" id="${previewFotoId}"></div>
    <input type="hidden" name="vehiculo_${vIndex}_foto_url" value="${datos.foto_url || ''}">
  `;

  contenedor.appendChild(registro);
  
  const mSelect = registro.querySelector(`#${motivoSelectId}`);
  mSelect.addEventListener('change', () => {
    alternarDestinoRemitente(mSelect, vIndex);
    manejarOtroCampo(mSelect);
  });

  registro.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', () => manejarOtroCampo(sel));
    manejarOtroCampo(sel);
  });

  const fInput = registro.querySelector(`#${fotoInputId}`);
  fInput.addEventListener('change', () => setupFotoPreview(fotoInputId, previewFotoId));
}

function agregarCampoParada(tipo, datos = {}) {
  const cont = document.getElementById('operacion-contenedor');
  const index = cont.children.length;
  const div = document.createElement('div');
  div.className = 'parada-group';
  div.dataset.index = index;
  div.innerHTML = `
    <p>🛑 Parada #<span class="numero-parada">${index + 1}</span> (Operación)</p>
    <div class="time-row">
      <div>
        <input type="tel" name="parada_inicio_operacion_${index}" class="time-input-masked" placeholder="HH:MM" value="${datos.inicio || ''}" onblur="applyTimeMask(this, 'op-ini-${index}')">
        <span id="op-ini-${index}" class="time-display"></span>
      </div>
      <div>
        <input type="tel" name="parada_fin_operacion_${index}" class="time-input-masked" placeholder="HH:MM" value="${datos.fin || ''}" onblur="applyTimeMask(this, 'op-fin-${index}')">
        <span id="op-fin-${index}" class="time-display"></span>
      </div>
    </div>
    <select name="parada_motivo_operacion_${index}">
      <option value="">Seleccione</option>
      <option value="pausas_activas" ${datos.motivo === 'pausas_activas' ? 'selected' : ''}>Pausas Activas</option>
      <option value="aseo" ${datos.motivo === 'aseo' ? 'selected' : ''}>Aseo</option>
      <option value="otro" ${datos.motivo === 'otro' ? 'selected' : ''}>Otro</option>
    </select>
    <input type="text" name="parada_otro_motivo_operacion_${index}" class="otro-input" value="${datos.otro_motivo || ''}">
    <button type="button" class="btn-eliminar" onclick="this.parentElement.remove(); guardarProgreso();">Eliminar</button>
  `;
  cont.appendChild(div);
  const sel = div.querySelector('select');
  sel.addEventListener('change', () => manejarOtroCampo(sel));
  guardarProgreso();
}

function setupFotoPreview(inputId, previewId) {
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => preview.innerHTML = `<img src="${e.target.result}">`;
    reader.readAsDataURL(input.files[0]);
  }
}

function actualizarCampos() {
  const lugar = document.getElementById("lugar").value;
  if (lugar === "Funza") {
    document.getElementById("coordinador").value = "Jeison Aranda";
    document.getElementById("lider_pepsico").value = "Alejandro Monroy";
    const h = new Date().getHours();
    document.getElementById("turno").value = (h >= 6 && h < 14) ? "Manana" : (h >= 14 && h < 22) ? "Tarde" : "Noche";
  }
  if (!document.getElementById("fecha").value) {
    document.getElementById("fecha").value = new Date().toISOString().split('T')[0];
  }
  guardarProgreso();
}

function applyTimeMask(input, displayId) {
  let value = input.value.replace(/[^0-9]/g, '');
  if (value.length === 1 && value > '2') value = '0' + value;
  if (value.length === 2 && value > '23') value = '23';
  if (value.length === 3 && value[2] > '5') value = value.substring(0,2) + '5';
  if (value.length >= 4) {
    value = value.substring(0,4).padStart(4,'0');
    let m = value.substring(2,4);
    if (m > '59') m = '59';
    value = value.substring(0,2) + m;
  }
  let formatted = value.length >= 2 ? value.substring(0,2) + ':' + (value.length > 2 ? value.substring(2,4) : '00') : '';
  input.value = formatted;
  convertirHoraMilitar(input, displayId);
  guardarProgreso();
}

function convertirHoraMilitar(input, displayId) {
  const v = input.value;
  const d = document.getElementById(displayId);
  if (!d) return;
  if (v.length === 5 && v.includes(':')) {
    const [h, m] = v.split(':').map(Number);
    const ampm = h >= 12 ? 'P.M.' : 'A.M.';
    const h12 = (h % 12) || 12;
    d.innerHTML = `Normal: ${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
  }
}

function actualizarTotalCajas() {
  let t = 0;
  document.querySelectorAll('.cajas-input-js').forEach(i => t += parseInt(i.value || 0));
  document.getElementById('cajas_totales').value = t;
}

function guardarProgreso() {
  const form = document.forms['formulario-pepsico'];
  const data = {};
  new FormData(form).forEach((value, key) => {
    if (!(value instanceof File) && key !== 'form-name') data[key] = value;
  });
  data._numVehiculos = document.getElementById('vehiculos-contenedor').children.length;
  const paradas = [];
  document.querySelectorAll('#operacion-contenedor .parada-group').forEach(grupo => {
    const idx = grupo.dataset.index;
    paradas.push({
      inicio: grupo.querySelector(`input[name="parada_inicio_operacion_${idx}"]`).value,
      fin: grupo.querySelector(`input[name="parada_fin_operacion_${idx}"]`).value,
      motivo: grupo.querySelector(`select[name="parada_motivo_operacion_${idx}"]`).value,
      otro_motivo: grupo.querySelector(`input[name="parada_otro_motivo_operacion_${idx}"]`).value
    });
  });
  data._paradasDetalle = paradas;
  localStorage.setItem('pepsico_data_final', JSON.stringify(data));
}

function limpiarTodo() {
  if (confirm("¿Borrar todo?")) { localStorage.removeItem('pepsico_data_final'); location.reload(); }
}

function enviarFormulario(event) {
  event.preventDefault();
  if (!validarSolapamientoVehiculos() || !validarSolapamientoParadas()) return;
  sincronizarVehiculosDesdeDOM();
  document.getElementById('datos_vehiculos').value = JSON.stringify(vehiculosData);
  localStorage.removeItem('pepsico_data_final');
  event.target.submit();
}

document.addEventListener('DOMContentLoaded', function() {
  const form = document.querySelector('form');
  const saved = localStorage.getItem('pepsico_data_final');

  if (saved) {
    const data = JSON.parse(saved);
    
    // 1. Vehículos
    const nV = data._numVehiculos || 1;
    document.getElementById('vehiculos-contenedor').innerHTML = '';
    vehiculosData = [];
    for(let i=0; i<nV; i++) {
      const v = {
        inicio: data[`vehiculo_${i}_inicio`] || '', fin: data[`vehiculo_${i}_fin`] || '',
        motivo: data[`vehiculo_${i}_motivo`] || '', otro_motivo: data[`vehiculo_${i}_otro_motivo`] || '',
        muelle: data[`vehiculo_${i}_muelle`] || '', otro_muelle_num: data[`vehiculo_${i}_otro_muelle_num`] || '',
        placa: data[`vehiculo_${i}_placa`] || '', tipo_vehi: data[`vehiculo_${i}_tipo_vehi`] || '',
        otro_tipo: data[`vehiculo_${i}_otro_tipo`] || '', destino: data[`vehiculo_${i}_destino`] || '',
        otro_destino: data[`vehiculo_${i}_otro_destino`] || '', origen: data[`vehiculo_${i}_origen`] || '',
        personas: data[`vehiculo_${i}_personas`] || '', cajas: data[`vehiculo_${i}_cajas`] || '',
        justificacion: data[`vehiculo_${i}_justificacion`] || '', otro_justificacion: data[`vehiculo_${i}_otro_justificacion`] || '',
        tiempo_muerto_inicio: data[`vehiculo_${i}_tiempo_muerto_inicio`] || '', tiempo_muerto_final: data[`vehiculo_${i}_tiempo_muerto_final`] || '',
        foto_url: data[`vehiculo_${i}_foto_url`] || ''
      };
      vehiculosData.push(v);
      crearVehiculoHTML(document.getElementById('vehiculos-contenedor'), i, v);
    }

    // 2. Paradas
    document.getElementById('operacion-contenedor').innerHTML = '';
    if (data._paradasDetalle) {
      data._paradasDetalle.forEach(p => agregarCampoParada('operacion', p));
    }

    // 3. Campos estáticos (Lugar, Líder, etc.)
    for (const key in data) {
      if (key.startsWith('_') || key.startsWith('vehiculo_') || key.startsWith('parada_')) continue;
      const el = form.elements[key];
      if (el) {
        el.value = data[key];
        if (el.id === 'coordinador') manejarOtroCoordinador();
      }
    }
    actualizarTotalCajas();
  } else {
    agregarRegistroVehiculo();
    agregarCampoParada('operacion');
    actualizarCampos();
  }

  form.addEventListener('submit', enviarFormulario);
  form.addEventListener('input', guardarProgreso);
  form.addEventListener('change', guardarProgreso);
});
</script>
