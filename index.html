<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Pepsico Funza</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 40px; }
        .logo-container { position: absolute; top: 50px; left: 50px; }
        .logo-container img { width: 200px; height: auto; }
        form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.2); width: 500px; margin: auto; }
        .registro-vehiculo { border: 2px solid #C76E00; padding: 15px; margin-top: 20px; border-radius: 10px; position: relative; }
        .parada-group { border: 1px dashed #ced4da; padding: 10px; margin-top: 15px; border-radius: 5px; }
        .form-group-custom { margin-top: 15px; display: flex; flex-direction: column; }
        .btn-agregar-registro, .btn-agregar-parada-op { background-color: #001855; color: white; border: none; cursor: pointer; margin-top: 15px; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; }
        .btn-agregar-registro:hover, .btn-agregar-parada-op:hover { background-color: #0056b3; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 8px; margin-top: 8px; border-radius: 8px; border: 1px solid #170303; }
        .time-row { display: flex; gap: 10px; align-items: flex-start; }
        .time-display { display: block; margin-top: 5px; font-size: 0.85em; color: #155724; font-weight: bold; }
        .time-label { font-weight: bold; display: block; margin-top: 5px; color: #007bff; }
        button[type="submit"] { background-color: #001855; color: white; border: none; cursor: pointer; margin-top: 20px; }
        .time-input-masked { text-align: center; font-size: 1.1em; letter-spacing: 2px; }
        .btn-eliminar { background-color:#8B0000 !important; width:auto !important; padding:5px 10px !important; margin-top:10px !important; border: none !important; color: white !important; }
        .btn-eliminar-registro { position: absolute; top: 10px; right: 10px; background-color: #8B0000 !important; color: white !important; border: none !important; padding: 5px 10px !important; cursor: pointer; font-size: 0.8em; width: auto; }
        .otro-input { margin-top:5px; display:none; }
        .preview-foto img { max-width: 100%; max-height: 200px; border: 1px solid #ddd; border-radius: 8px; margin-top: 8px; }
        .btn-borrar-todo { background-color: #8B0000; color: white; margin-top: 20px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="prueba.png" alt="Logo"> 
    </div>
    <h2 style="text-align:center;">FORMULARIO - PEPSICO FUNZA</h2>

    <form name="formulario-pepsico" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="formulario-pepsico" />

        <label for="lugar">Lugar de operación:</label>
        <select name="lugar" id="lugar" required onchange="actualizarCampos()">
            <option value="">Seleccione una opción</option>
            <option value="Funza">Pepsico Funza</option>
        </select>

        <label for="lider">Líder Asignado:</label>
        <input type="text" name="lider_asignado" id="lider" required placeholder="Primer Nombre y Primer Apellido">

        <label for="coordinador">Coordinador Asignado:</label>
        <input type="text" name="coordinador" id="coordinador" readonly required>

        <label for="lider_pepsico">Líder De Pepsico:</label>
        <select name="lider_pepsico" id="lider_pepsico" required>
            <option value="">Seleccione un líder</option>
            <option value="Alejandro Ariza">Alejandro Ariza</option>
            <option value="Alejandro Monroy">Alejandro Monroy</option>
            <option value="Carlos Ruiz">Carlos Ruiz</option>
        </select>

        <label for="fecha">Fecha:</label>
        <input type="date" name="fecha" id="fecha" required>

        <label for="turno">Turno Asignado:</label>
        <select name="turno" id="turno" required>
            <option value="">Seleccione un turno</option>
            <option value="Manana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
        </select>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.3em; color:#C76E00;">REGISTRO DE VEHÍCULOS</h3>
        <div id="vehiculos-contenedor"></div>
        <button type="button" class="btn-agregar-registro" onclick="agregarRegistroVehiculo()">+ Registrar Nuevo Vehículo</button>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.3em; color:#001855;">PARADAS DE OPERACIÓN</h3>
        <div id="operacion-contenedor"></div>
        <button type="button" class="btn-agregar-parada-op" onclick="agregarCampoParada('operacion')">+ Agregar Parada</button>

        <hr style="margin-top: 25px; border-style: dotted;">
        <label for="total_personas">Total Personas En El Turno:</label>
        <input type="number" name="total_personas" id="total_personas" min="1" required>
        <label for="cajas_totales">Total Cajas Movidas:</label>
        <input type="number" name="cajas_totales" id="cajas_totales" readonly>
        
        <input type="hidden" name="datos_vehiculos" id="datos_vehiculos">
        <input type="hidden" name="datos_paradas_operacion" id="datos_paradas_operacion">

        <div style="display: flex; gap: 10px;">
            <button type="submit" style="flex: 3;">Enviar</button>
            <button type="button" class="btn-borrar-todo" style="flex: 1;" onclick="limpiarTodo()">Borrar Todo</button>
        </div>
    </form>

    <script>
        let vehiculosData = [];

        function horaAMinutos(horaStr) {
            if (!horaStr || !horaStr.includes(':')) return null;
            const [h, m] = horaStr.split(':').map(Number);
            return h * 60 + m;
        }

        function rangosSeSolapan(inicio1, fin1, inicio2, fin2) {
            const i1 = horaAMinutos(inicio1), f1 = horaAMinutos(fin1);
            const i2 = horaAMinutos(inicio2), f2 = horaAMinutos(fin2);
            if (i1 === null || f1 === null || i2 === null || f2 === null) return false;
            return i1 < f2 && i2 < f1;
        }

        function validarSolapamientoVehiculos() {
            const muelleOcupado = {};
            const regs = document.querySelectorAll('.registro-vehiculo');
            for (let reg of regs) {
                const idx = reg.dataset.index;
                const muelleSelect = reg.querySelector(`select[name="vehiculo_${idx}_muelle"]`).value;
                const muelleFinal = muelleSelect === 'otro' ? reg.querySelector(`input[name="vehiculo_${idx}_otro_muelle_num"]`).value : muelleSelect;
                const inicio = reg.querySelector(`input[name="vehiculo_${idx}_inicio"]`).value;
                const fin = reg.querySelector(`input[name="vehiculo_${idx}_fin"]`).value;
                
                if (!muelleFinal || !inicio || !fin) continue;
                if (!muelleOcupado[muelleFinal]) muelleOcupado[muelleFinal] = [];
                
                for (let r of muelleOcupado[muelleFinal]) {
                    if (rangosSeSolapan(inicio, fin, r.inicio, r.fin)) {
                        alert(`¡Conflicto en muelle ${muelleFinal}!`);
                        return false;
                    }
                }
                muelleOcupado[muelleFinal].push({ inicio, fin });
            }
            return true;
        }

        function validarSolapamientoParadas() {
            const paradas = [];
            const grupos = document.querySelectorAll('#operacion-contenedor .parada-group');
            for (let g of grupos) {
                const pIdx = g.dataset.index;
                const i = g.querySelector(`input[name="parada_inicio_operacion_${pIdx}"]`).value;
                const f = g.querySelector(`input[name="parada_fin_operacion_${pIdx}"]`).value;
                if (i && f) {
                    for (let p of paradas) {
                        if (rangosSeSolapan(i, f, p.i, p.f)) {
                            alert("¡Las paradas de operación se superponen!");
                            return false;
                        }
                    }
                    paradas.push({ i, f });
                }
            }
            return true;
        }

        function agregarRegistroVehiculo() {
            const container = document.getElementById('vehiculos-contenedor');
            const vIndex = container.querySelectorAll('.registro-vehiculo').length;
            const registro = document.createElement('div');
            registro.className = 'registro-vehiculo';
            registro.dataset.index = vIndex;
            registro.innerHTML = `
                <button type="button" class="btn-eliminar-registro" onclick="this.parentElement.remove(); actualizarTotalCajas(); guardarProgreso();">Eliminar</button>
                <h4 style="color:#C76E00;">VEHÍCULO #${vIndex + 1}</h4>
                <div class="time-row">
                    <div>
                        <label>Hora Inicio:</label>
                        <input type="tel" name="vehiculo_${vIndex}_inicio" class="time-input-masked" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'v-ini-${vIndex}')">
                        <span id="v-ini-${vIndex}" class="time-display"></span>
                    </div>
                    <div>
                        <label>Hora Final:</label>
                        <input type="tel" name="vehiculo_${vIndex}_fin" class="time-input-masked" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'v-fin-${vIndex}')">
                        <span id="v-fin-${vIndex}" class="time-display"></span>
                    </div>
                </div>
                <label>Placa:</label>
                <input type="text" name="vehiculo_${vIndex}_placa" id="placa_${vIndex}" required maxlength="6" 
                    oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); guardarProgreso();" placeholder="ABC123">
                <label>Muelle:</label>
                <select name="vehiculo_${vIndex}_muelle" onchange="this.nextElementSibling.style.display = (this.value === 'otro' ? 'block' : 'none'); guardarProgreso();">
                    <option value="3">3</option><option value="11">11</option><option value="12">12</option><option value="otro">Otro</option>
                </select>
                <input type="number" name="vehiculo_${vIndex}_otro_muelle_num" class="otro-input" placeholder="N° Muelle">
                <label>Cajas:</label>
                <input type="number" name="vehiculo_${vIndex}_cajas" class="cajas-input-js" oninput="actualizarTotalCajas(); guardarProgreso();">
                <label>Foto:</label>
                <input type="file" id="foto_${vIndex}" accept="image/*" capture="environment" onchange="subirFoto(${vIndex})">
                <input type="hidden" name="vehiculo_${vIndex}_foto_url" id="url_${vIndex}" value="">
                <div id="prev_${vIndex}" class="preview-foto"></div>
            `;
            container.appendChild(registro);
        }

        async function subirFoto(vIndex) {
            const file = document.getElementById(`foto_${vIndex}`).files[0];
            const placa = document.getElementById(`placa_${vIndex}`).value || 'SIN_PLACA';
            const fecha = document.getElementById('fecha').value;
            const preview = document.getElementById(`prev_${vIndex}`);
            if(!file) return;
            const fechaNorm = fecha ? fecha.split('-').reverse().join('.') : '00.00.0000';
            const formData = new FormData();
            formData.append('image', file);
            formData.append('key', '7aa1cd8e8d0a3558833f225cbeba96ac');
            formData.append('name', `${fechaNorm}.${placa}.vehiculo_${vIndex}`);
            preview.innerHTML = "Subiendo...";
            try {
                const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    document.getElementById(`url_${vIndex}`).value = data.data.url;
                    preview.innerHTML = `<img src="${data.data.url}"><p>✅ Guardada</p>`;
                    guardarProgreso();
                }
            } catch(e) { alert("Error al subir foto"); }
        }

        function agregarCampoParada() {
            const container = document.getElementById('operacion-contenedor');
            const pIdx = container.querySelectorAll('.parada-group').length;
            const div = document.createElement('div');
            div.className = 'parada-group';
            div.dataset.index = pIdx;
            div.innerHTML = `
                <label>Parada #${pIdx + 1}</label>
                <div class="time-row">
                    <input type="tel" name="parada_inicio_operacion_${pIdx}" placeholder="Inicio HH:MM" class="time-input-masked" onblur="applyTimeMask(this, 'p-ini-${pIdx}')">
                    <input type="tel" name="parada_fin_operacion_${pIdx}" placeholder="Fin HH:MM" class="time-input-masked" onblur="applyTimeMask(this, 'p-fin-${pIdx}')">
                </div>
                <span id="p-ini-${pIdx}" class="time-display"></span>
                <select name="parada_motivo_operacion_${pIdx}" onchange="guardarProgreso()">
                    <option value="Aseo">Aseo</option><option value="Pausas">Pausas Activas</option><option value="Almuerzo">Almuerzo</option>
                </select>
                <button type="button" class="btn-eliminar" onclick="this.parentElement.remove(); guardarProgreso();">Quitar</button>
            `;
            container.appendChild(div);
        }

        function applyTimeMask(input, spanId) {
            let v = input.value.replace(/\D/g,'');
            if(v.length >= 2) v = v.substring(0,2) + ":" + v.substring(2,4);
            input.value = v;
            guardarProgreso();
        }

        function actualizarTotalCajas() {
            let t = 0;
            document.querySelectorAll('.cajas-input-js').forEach(i => t += parseInt(i.value || 0));
            document.getElementById('cajas_totales').value = t;
        }

        function actualizarCampos() {
            if(document.getElementById('lugar').value === 'Funza') {
                document.getElementById('coordinador').value = "Jeison Aranda";
                if(!document.getElementById('fecha').value) document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
            }
            guardarProgreso();
        }

        function guardarProgreso() {
            const data = {};
            new FormData(document.forms[0]).forEach((v, k) => { if(!(v instanceof File)) data[k] = v; });
            data._vCount = document.querySelectorAll('.registro-vehiculo').length;
            data._pCount = document.querySelectorAll('.parada-group').length;
            localStorage.setItem('pepsico_v4', JSON.stringify(data));
        }

        function limpiarTodo() { if(confirm("¿Borrar todo?")) { localStorage.removeItem('pepsico_v4'); location.reload(); } }

        function enviarFormulario(event) {
            event.preventDefault();
            // Recolectar Vehículos
            const vArr = [];
            document.querySelectorAll('.registro-vehiculo').forEach(r => {
                const idx = r.dataset.index;
                vArr.push({
                    inicio: r.querySelector(`input[name="vehiculo_${idx}_inicio"]`).value,
                    fin: r.querySelector(`input[name="vehiculo_${idx}_fin"]`).value,
                    placa: r.querySelector(`input[name="vehiculo_${idx}_placa"]`).value,
                    cajas: r.querySelector(`input[name="vehiculo_${idx}_cajas"]`).value,
                    url: r.querySelector(`#url_${idx}`).value
                });
            });
            document.getElementById('datos_vehiculos').value = JSON.stringify(vArr);

            // Recolectar Paradas
            const pArr = [];
            document.querySelectorAll('.parada-group').forEach(g => {
                const idx = g.dataset.index;
                pArr.push({
                    inicio: g.querySelector(`input[name="parada_inicio_operacion_${idx}"]`).value,
                    fin: g.querySelector(`input[name="parada_fin_operacion_${idx}"]`).value,
                    motivo: g.querySelector(`select[name="parada_motivo_operacion_${idx}"]`).value
                });
            });
            document.getElementById('datos_paradas_operacion').value = JSON.stringify(pArr);

            if(!validarSolapamientoVehiculos() || !validarSolapamientoParadas()) return;
            
            // Convertir textos a MAYÚSCULAS
            document.querySelectorAll('input[type="text"]').forEach(i => i.value = i.value.toUpperCase());
            localStorage.removeItem('pepsico_v4');
            event.target.submit();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('pepsico_v4');
            if(saved) {
                const d = JSON.parse(saved);
                for(let i=0; i<(d._vCount || 1); i++) agregarRegistroVehiculo();
                for(let i=0; i<(d._pCount || 0); i++) agregarCampoParada();
                Object.keys(d).forEach(k => { if(document.forms[0].elements[k]) document.forms[0].elements[k].value = d[k]; });
                actualizarTotalCajas();
            } else { agregarRegistroVehiculo(); agregarCampoParada(); actualizarCampos(); }
            document.forms[0].addEventListener('submit', enviarFormulario);
        });
    </script>
</body>
</html>
