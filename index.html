<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Pepsico Funza</title>
    <style>
        /* Mantenemos tu diseño original exacto */
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 40px; }
        .logo-container { position: absolute; top: 50px; left: 50px; }
        .logo-container img { width: 200px; height: auto; }
        form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.2); width: 500px; margin: auto; }
        .registro-vehiculo { border: 2px solid #C76E00; padding: 15px; margin-top: 20px; border-radius: 10px; position: relative; }
        .parada-group { border: 1px dashed #ced4da; padding: 10px; margin-top: 15px; border-radius: 5px; }
        .form-group-custom { margin-top: 15px; display: flex; flex-direction: column; }
        .btn-agregar-registro, .btn-agregar-parada-op { background-color: #001855; color: white; border: none; cursor: pointer; margin-top: 15px; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; }
        .btn-agregar-registro:hover, .btn-agregar-parada-op:hover { background-color: #0056b3; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 8px; margin-top: 8px; border-radius: 8px; border: 1px solid #170303; }
        .time-row { display: flex; gap: 10px; align-items: flex-start; }
        .time-display { display: block; margin-top: 5px; font-size: 0.85em; color: #155724; font-weight: bold; }
        .time-label { font-weight: bold; display: block; margin-top: 5px; color: #007bff; }
        button[type="submit"] { background-color: #001855; color: white; border: none; cursor: pointer; margin-top: 20px; }
        .time-input-masked { text-align: center; font-size: 1.1em; letter-spacing: 2px; }
        .btn-eliminar { background-color:#8B0000 !important; width:auto !important; padding:5px 10px !important; margin-top:10px !important; border: none !important; color: white !important; }
        .btn-eliminar-registro { position: absolute; top: 10px; right: 10px; background-color: #8B0000 !important; color: white !important; border: none !important; padding: 5px 10px !important; cursor: pointer; font-size: 0.8em; width: auto; }
        .otro-input { margin-top:5px; display:none; }
        .preview-foto img { max-width: 100%; max-height: 200px; border: 1px solid #ddd; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="prueba.png" alt="Logo de la Empresa"> 
    </div>
    <h2 style="text-align:center;">FORMULARIO - PEPSICO FUNZA</h2>

    <form name="formulario-pepsico" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="formulario-pepsico" />

        <label for="lugar">Lugar de operación:</label>
        <select name="lugar" id="lugar" required onchange="actualizarCampos()">
            <option value="">Seleccione una opción</option>
            <option value="Funza">Pepsico Funza</option>
        </select>

        <label for="lider">Líder Asignado:</label>
        <input type="text" name="lider_asignado" id="lider" required placeholder="Primer Nombre y Primer Apellido">

        <label for="coordinador">Coordinador Asignado:</label>
        <input type="text" name="coordinador" id="coordinador" readonly required>

        <label for="lider_pepsico">Líder De Pepsico:</label>
        <select name="lider_pepsico" id="lider_pepsico" required>
            <option value="">Seleccione un líder</option>
            <option value="Alejandro Ariza">Alejandro Ariza</option>
            <option value="Alejandro Monroy">Alejandro Monroy</option>
            <option value="Carlos Ruiz">Carlos Ruiz</option>
        </select>

        <label for="fecha">Fecha:</label>
        <input type="date" name="fecha" id="fecha" required>

        <label for="turno">Turno Asignado:</label>
        <select name="turno" id="turno" required>
            <option value="">Seleccione un turno</option>
            <option value="Manana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
        </select>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.3em; color:#C76E00;">REGISTRO DE VEHÍCULOS</h3>
        <div id="vehiculos-contenedor"></div>
        <button type="button" class="btn-agregar-registro" onclick="agregarRegistroVehiculo()">+ Registrar Nuevo Vehículo</button>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.3em; color:#001855;">PARADAS DE OPERACIÓN</h3>
        <div id="operacion-contenedor"></div>
        <button type="button" class="btn-agregar-parada-op" onclick="agregarCampoParada('operacion')">+ Agregar Parada</button>

        <hr style="margin-top: 25px; border-style: dotted;">
        <label for="total_personas">Total Personas En El Turno:</label>
        <input type="number" name="total_personas" id="total_personas" min="1" required>
        
        <label for="cajas_totales">Total Cajas Movidas:</label>
        <input type="number" name="cajas_totales" id="cajas_totales" readonly>
        
        <input type="hidden" name="datos_vehiculos" id="datos_vehiculos">
        <input type="hidden" name="datos_paradas_operacion" id="datos_paradas_operacion">

        <button type="submit">Enviar</button>
    </form>

    <script>
        // Función para recolectar datos reales antes de enviar
        function recolectarDatos() {
            // 1. Recolectar Vehículos
            const vehiculosArr = [];
            const registros = document.querySelectorAll('.registro-vehiculo');
            registros.forEach(reg => {
                const idx = reg.dataset.index;
                const muelleSelect = reg.querySelector(`select[name="vehiculo_${idx}_muelle"]`).value;
                const placa = reg.querySelector(`input[name="vehiculo_${idx}_placa"]`).value;
                
                vehiculosArr.push({
                    inicio: reg.querySelector(`input[name="vehiculo_${idx}_inicio"]`).value,
                    fin: reg.querySelector(`input[name="vehiculo_${idx}_fin"]`).value,
                    placa: placa,
                    muelle: muelleSelect === 'otro' ? reg.querySelector(`input[name="vehiculo_${idx}_otro_muelle_num"]`).value : muelleSelect,
                    tipo: reg.querySelector(`select[id="tipo_vehi_${idx}"]`).value,
                    cajas: reg.querySelector(`input[name="vehiculo_${idx}_cajas"]`).value,
                    foto_url: reg.querySelector(`#foto_url_${idx}`).value
                });
            });
            document.getElementById('datos_vehiculos').value = JSON.stringify(vehiculosArr);

            // 2. Recolectar Paradas Operación
            const paradasArr = [];
            const grupos = document.querySelectorAll('#operacion-contenedor .parada-group');
            grupos.forEach(grupo => {
                const pIdx = grupo.dataset.index;
                const inicio = grupo.querySelector(`input[name="parada_inicio_operacion_${pIdx}"]`).value;
                const fin = grupo.querySelector(`input[name="parada_fin_operacion_${pIdx}"]`).value;
                const motivo = grupo.querySelector(`select[name="parada_motivo_operacion_${pIdx}"]`).value;

                if(inicio && fin) {
                    paradasArr.push({ inicio, fin, motivo });
                }
            });
            document.getElementById('datos_paradas_operacion').value = JSON.stringify(paradasArr);
        }

        // --- FUNCIONES DE SEGURIDAD Y MASCARAS ---
        function applyTimeMask(input, displayId) {
            let v = input.value.replace(/\D/g,'');
            if(v.length >= 2) v = v.substring(0,2) + ":" + v.substring(2,4);
            input.value = v;
            // Mostrar hora AM/PM para ayuda visual
            const display = document.getElementById(displayId);
            if(v.length === 5) {
                const [h, m] = v.split(':').map(Number);
                if(h < 24 && m < 60) {
                    const ampm = h >= 12 ? 'P.M.' : 'A.M.';
                    const h12 = (h % 12) || 12;
                    display.innerText = `Hora: ${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
                }
            }
        }

        function agregarRegistroVehiculo() {
            const container = document.getElementById('vehiculos-contenedor');
            const vIndex = container.children.length;
            const registro = document.createElement('div');
            registro.className = 'registro-vehiculo';
            registro.dataset.index = vIndex;
            registro.innerHTML = `
                <button type="button" class="btn-eliminar-registro" onclick="this.parentElement.remove(); actualizarTotalCajas();">Eliminar</button>
                <h4 style="color:#C76E00;">VEHÍCULO #${vIndex + 1}</h4>
                <div class="time-row">
                    <div>
                        <label>Inicio:</label>
                        <input type="tel" name="vehiculo_${vIndex}_inicio" class="time-input-masked" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'v-ini-${vIndex}')">
                        <span id="v-ini-${vIndex}" class="time-display"></span>
                    </div>
                    <div>
                        <label>Final:</label>
                        <input type="tel" name="vehiculo_${vIndex}_fin" class="time-input-masked" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'v-fin-${vIndex}')">
                        <span id="v-fin-${vIndex}" class="time-display"></span>
                    </div>
                </div>
                <label>Placa:</label>
                <input type="text" name="vehiculo_${vIndex}_placa" id="placa_${vIndex}" required maxlength="6" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
                
                <label>Tipo Vehículo:</label>
                <select id="tipo_vehi_${vIndex}" required>
                    <option value="Camion">Camión</option>
                    <option value="Tractomula">Tractomula</option>
                    <option value="Van">Van</option>
                </select>

                <label>Muelle:</label>
                <select name="vehiculo_${vIndex}_muelle" onchange="this.nextElementSibling.style.display = (this.value === 'otro' ? 'block' : 'none')">
                    <option value="3">3</option>
                    <option value="11">11</option>
                    <option value="otro">Otro</option>
                </select>
                <input type="number" name="vehiculo_${vIndex}_otro_muelle_num" class="otro-input" placeholder="N° Muelle">

                <label>Cajas:</label>
                <input type="number" name="vehiculo_${vIndex}_cajas" class="cajas-input-js" oninput="actualizarTotalCajas()">

                <label>Foto:</label>
                <input type="file" id="foto_${vIndex}" accept="image/*" capture="environment" onchange="subirFoto(${vIndex})">
                <input type="hidden" name="vehiculo_${vIndex}_foto_url" id="foto_url_${vIndex}" value="">
                <div id="prev_${vIndex}" class="preview-foto"></div>
            `;
            container.appendChild(registro);
        }

        async function subirFoto(vIndex) {
            const file = document.getElementById(`foto_${vIndex}`).files[0];
            const placa = document.getElementById(`placa_${vIndex}`).value || 'SIN_PLACA';
            const fecha = document.getElementById('fecha').value || '00-00-00';
            const preview = document.getElementById(`prev_${vIndex}`);
            
            if(!file) return;
            preview.innerHTML = "Subiendo...";

            const formData = new FormData();
            formData.append('image', file);
            formData.append('key', '7aa1cd8e8d0a3558833f225cbeba96ac');
            formData.append('name', `${fecha}.${placa}.vehiculo_${vIndex}`);

            try {
                const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    document.getElementById(`foto_url_${vIndex}`).value = data.data.url;
                    preview.innerHTML = `<img src="${data.data.url}"><p>✅ Guardada</p>`;
                }
            } catch(e) { alert("Error al subir foto"); }
        }

        function agregarCampoParada() {
            const container = document.getElementById('operacion-contenedor');
            const pIdx = container.children.length;
            const div = document.createElement('div');
            div.className = 'parada-group';
            div.dataset.index = pIdx;
            div.innerHTML = `
                <label>Parada #${pIdx + 1}</label>
                <div class="time-row">
                    <input type="tel" name="parada_inicio_operacion_${pIdx}" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'p-ini-${pIdx}')">
                    <input type="tel" name="parada_fin_operacion_${pIdx}" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'p-fin-${pIdx}')">
                </div>
                <span id="p-ini-${pIdx}" class="time-display"></span>
                <select name="parada_motivo_operacion_${pIdx}">
                    <option value="Aseo">Aseo</option>
                    <option value="Almuerzo">Almuerzo</option>
                    <option value="Pausas">Pausas Activas</option>
                </select>
                <button type="button" class="btn-eliminar" onclick="this.parentElement.remove()">Quitar</button>
            `;
            container.appendChild(div);
        }

        function actualizarTotalCajas() {
            let total = 0;
            document.querySelectorAll('.cajas-input-js').forEach(i => total += parseInt(i.value || 0));
            document.getElementById('cajas_totales').value = total;
        }

        function actualizarCampos() {
            if(document.getElementById('lugar').value === 'Funza') {
                document.getElementById('coordinador').value = "Jeison Aranda";
                document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
            }
        }

        // --- ENVÍO FINAL ---
        document.forms[0].onsubmit = function(e) {
            recolectarDatos(); // <--- Aquí es donde se asegura que se guarden los campos ocultos
            const txts = document.querySelectorAll('input[type="text"]');
            txts.forEach(t => t.value = t.value.toUpperCase());
            return true;
        };

        window.onload = () => { agregarRegistroVehiculo(); agregarCampoParada(); };
    </script>
</body>
</html>
