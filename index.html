<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Pepsico Funza</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f8f9fa;
padding: 40px;
}
.logo-container {
position: absolute;
top: 50px;
left: 50px;
}
.logo-container img {
width: 200px;
height: auto;
}
form {
background: white;
padding: 20px;
border-radius: 15px;
box-shadow: 0 0 10px rgba(0,0,0,0.2);
width: 500px;
margin: auto;
}
.registro-vehiculo {
border: 2px solid #C76E00;
padding: 15px;
margin-top: 20px;
border-radius: 10px;
position: relative;
}
.parada-group {
border: 1px dashed #ced4da;
padding: 10px;
margin-top: 15px;
border-radius: 5px;
}
.form-group-custom {
margin-top: 15px;
display: flex;
flex-direction: column;
}
.btn-agregar-registro,
.btn-agregar-parada-op {
background-color: #001855;
color: white;
border: none;
cursor: pointer;
margin-top: 15px;
width: 100%;
padding: 12px;
border-radius: 8px;
font-weight: bold;
}
.btn-agregar-registro:hover,
.btn-agregar-parada-op:hover {
background-color: #0056b3;
}
label {
font-weight: bold;
display: block;
margin-top: 15px;
}
select, input, button {
width: 100%;
padding: 8px;
margin-top: 8px;
border-radius: 8px;
border: 1px solid #170303;
}
.time-row {
display: flex;
gap: 10px;
align-items: flex-start;
}
.time-row > div {
flex-grow: 1;
position: relative;
}
.time-display {
display: block;
margin-top: 5px;
font-size: 0.85em;
color: #155724;
font-weight: bold;
}
.time-label {
font-weight: bold;
display: block;
margin-top: 5px;
color: #007bff;
}
button[type="submit"] {
background-color: #001855;
color: white;
border: none;
cursor: pointer;
margin-top: 20px;
}
button[type="submit"]:hover {
background-color: #0056b3;
}
.time-input-masked {
text-align: center;
font-size: 1.1em;
letter-spacing: 2px;
}
.btn-eliminar {
background-color:#8B0000 !important;
width:auto !important;
padding:5px 10px !important;
margin-top:10px !important;
border: none !important;
color: white !important;
}
.btn-eliminar-registro {
position: absolute;
top: 10px;
right: 10px;
background-color: #8B0000 !important;
color: white !important;
border: none !important;
padding: 5px 10px !important;
cursor: pointer;
font-size: 0.8em;
width: auto;
}
.otro-input {
margin-top:5px;
display:none;
}
.preview-foto img {
max-width: 100%;
max-height: 200px;
border: 1px solid #ddd;
border-radius: 8px;
margin-top: 8px;
}
.btn-borrar-todo {
background-color: #8B0000;
color: white;
margin-top: 20px;
border: none;
cursor: pointer;
font-weight: bold;
}
</style>
</head>
<body>
<div class="logo-container">
<img src="prueba.png" alt="Logo de la Empresa">
</div>
<h2 style="text-align:center;">FORMULARIO - PEPSICO FUNZA</h2>
<form name="formulario-pepsico" method="POST" data-netlify="true">
<input type="hidden" name="form-name" value="formulario-pepsico" />
<label for="lugar">Lugar de operación:</label>
<select name="lugar" id="lugar" required onchange="actualizarCampos()">
<option value="">Seleccione una opción</option>
<option value="Funza">Pepsico Funza</option>
</select>
<label for="lider">Líder Asignado:</label>
<input type="text" name="lider" id="lider" required placeholder="Primer Nombre y Primer Apellido">
<label for="coordinador">Coordinador Asignado:</label>
<input type="text" name="coordinador" id="coordinador" readonly required>
<label for="lider_pepsico">Líder De Pepsico:</label>
<select name="lider_pepsico" id="lider_pepsico" required>
<option value="">Seleccione un líder</option>
<option value="Alejandro Ariza">Alejandro Ariza</option>
<option value="Alejandro Monroy">Alejandro Monroy</option>
<option value="Carlos Ruiz">Carlos Ruiz</option>
</select>
<label for="fecha">Fecha:</label>
<input type="date" name="fecha" id="fecha" required>
<label for="turno">Turno Asignado:</label>
<select name="turno" id="turno" required>
<option value="">Seleccione un turno</option>
<option value="Manana">Mañana</option>
<option value="Tarde">Tarde</option>
<option value="Noche">Noche</option>
</select>
<hr style="margin-top: 25px; border-style: dotted;">
<h3 style="text-align:center; font-size:1.3em; color:#C76E00;">REGISTRO DE VEHÍCULOS</h3>
<div id="vehiculos-contenedor"></div>
<button type="button" class="btn-agregar-registro" onclick="agregarRegistroVehiculo()">
+ Registrar Nuevo Vehículo
</button>
<hr style="margin-top: 25px; border-style: dotted;">
<h3 style="text-align:center; font-size:1.3em; color:#001855;">PARADAS DE OPERACIÓN</h3>
<div id="operacion-contenedor"></div>
<button type="button" class="btn-agregar-parada-op" onclick="agregarCampoParada('operacion')">
+ Agregar Parada
</button>
<hr style="margin-top: 25px; border-style: dotted;">
<h3 style="text-align:center; font-size:1.1em; color:#296097;">TOTALES DE TURNO</h3>
<label for="total_personas">Total Personas En El Turno:</label>
<input type="number" name="total_personas" id="total_personas" min="1" required
placeholder="Total de empleados en el turno">
<label for="cajas_totales">Total Cajas Movidas:</label>
<input type="number" name="cajas_totales" id="cajas_totales" min="0" required
placeholder="Cantidad total de cajas movidas" oninput="actualizarTotalCajas()">
<!-- ⚠️ NO HAY CAMPOS OCULTOS PREDEFINIDOS. Se generan dinámicamente al enviar. -->
<div style="display: flex; gap: 10px;">
<button type="submit" style="flex: 3;">Enviar</button>
<button type="button" class="btn-borrar-todo" style="flex: 1;" onclick="limpiarTodo()">Borrar Todo</button>
</div>
</form>
<script>
let vehiculosData = [];

function horaAMinutos(horaStr) {
  if (!horaStr || !horaStr.includes(':')) return null;
  const [h, m] = horaStr.split(':').map(Number);
  if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
  return h * 60 + m;
}

function rangosSeSolapan(inicio1, fin1, inicio2, fin2) {
  const i1 = horaAMinutos(inicio1);
  const f1 = horaAMinutos(fin1);
  const i2 = horaAMinutos(inicio2);
  const f2 = horaAMinutos(fin2);
  if (i1 === null || f1 === null || i2 === null || f2 === null) return false;
  return i1 < f2 && i2 < f1;
}

function validarSolapamientoVehiculos() {
  const agrupados = {};
  for (let idx = 0; idx < vehiculosData.length; idx++) {
    const data = vehiculosData[idx];
    if (!data.muelle && data.muelle !== 'otro') continue;
    const muelle = data.muelle === 'otro' ? (data.otro_muelle_num || '') : data.muelle;
    if (!muelle || !data.inicio || !data.fin) continue;
    if (!agrupados[muelle]) agrupados[muelle] = [];
    agrupados[muelle].push({ inicio: data.inicio, fin: data.fin, idx });
  }
  for (const muelle in agrupados) {
    const regs = agrupados[muelle];
    for (let i = 0; i < regs.length; i++) {
      for (let j = i + 1; j < regs.length; j++) {
        if (rangosSeSolapan(regs[i].inicio, regs[i].fin, regs[j].inicio, regs[j].fin)) {
          alert(`¡Conflicto en muelle ${muelle}! Vehículos #${regs[i].idx + 1} y #${regs[j].idx + 1} se superponen.`);
          return false;
        }
      }
    }
  }
  return true;
}

function validarSolapamientoParadas() {
  const paradas = [];
  const cont = document.getElementById('operacion-contenedor');
  const grupos = cont.querySelectorAll('.parada-group');
  grupos.forEach((grupo, idx) => {
    const telInputs = grupo.querySelectorAll('input[type="tel"]');
    const inicio = telInputs[0]?.value || '';
    const fin = telInputs[1]?.value || '';
    if (inicio && fin) paradas.push({ inicio, fin, idx });
  });
  for (let i = 0; i < paradas.length; i++) {
    for (let j = i + 1; j < paradas.length; j++) {
      if (rangosSeSolapan(paradas[i].inicio, paradas[i].fin, paradas[j].inicio, paradas[j].fin)) {
        alert(`¡Las paradas de operación #${i + 1} y #${j + 1} se superponen!`);
        return false;
      }
    }
  }
  return true;
}

function eliminarRegistroVehiculo(index) {
  if (vehiculosData.length <= 1) {
    alert("Debe haber al menos un vehículo.");
    return;
  }
  vehiculosData.splice(index, 1);
  const registro = document.querySelector(`.registro-vehiculo[data-index="${index}"]`);
  if (registro) registro.remove();
  reindexarVehiculos();
  actualizarTotalCajas();
  guardarProgreso();
}

function reindexarVehiculos() {
  const contenedor = document.getElementById('vehiculos-contenedor');
  const registros = contenedor.querySelectorAll('.registro-vehiculo');
  contenedor.innerHTML = '';
  for (let i = 0; i < vehiculosData.length; i++) {
    crearVehiculoHTML(contenedor, i, vehiculosData[i]);
  }
}

function agregarRegistroVehiculo() {
  const vIndex = vehiculosData.length;
  vehiculosData.push({});
  const contenedor = document.getElementById('vehiculos-contenedor');
  crearVehiculoHTML(contenedor, vIndex, {});
  actualizarTotalCajas();
  guardarProgreso();
}

function crearVehiculoHTML(contenedor, vIndex, datos = {}) {
  const inicioId = `cargue-inicio-${vIndex}`;
  const finId = `cargue-fin-${vIndex}`;
  const fotoInputId = `foto_vehiculo_${vIndex}`;
  const previewFotoId = `preview_foto_${vIndex}`;
  const motivoSelectId = `motivo-cargue-descargue-${vIndex}`;
  const registro = document.createElement('div');
  registro.className = 'registro-vehiculo';
  registro.dataset.index = vIndex;

  let fechaFormateada = '01.01.1970';
  const fechaInput = document.getElementById('fecha').value;
  if (fechaInput) {
    const [yyyy, mm, dd] = fechaInput.split('-');
    fechaFormateada = `${dd}.${mm}.${yyyy}`;
  } else {
    const hoy = new Date();
    const dd = String(hoy.getDate()).padStart(2, '0');
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const yyyy = hoy.getFullYear();
    fechaFormateada = `${dd}.${mm}.${yyyy}`;
  }

  const tipoVehiculo = datos.tipo_vehi?.replace(/ /g, '_') || 'vehiculo';
  const nombrePersonalizado = `${fechaFormateada}.${tipoVehiculo}.vehiculo_${vIndex}`;

  const html = `
<button type="button" class="btn-eliminar-registro" onclick="eliminarRegistroVehiculo(${vIndex})">Eliminar Vehículo #${vIndex + 1}</button>
<hr style="margin-top:25px; border-style:dashed;">
<h4 style="text-align:center; color:#C76E00;">VEHÍCULO #${vIndex + 1}</h4>
<h5 style="text-align:center; color:#C76E00;">PARADA DE CARGUE/DESCARGUE</h5>
<div class="parada-group">
<p style="font-weight:bold; margin-top:0; color:#555;">🛑 Parada #1 (Cargue/Descargue)</p>
<div class="time-row">
<div>
<label class="time-label">Hora Inicio (HH:MM):</label>
<input type="tel" class="time-input-masked" required
placeholder="HH:MM" maxlength="5" value="${datos.inicio || ''}"
onblur="applyTimeMask(this, '${inicioId}');">
<span id="${inicioId}" class="time-display"></span>
</div>
<div>
<label class="time-label">Hora Final (HH:MM):</label>
<input type="tel" class="time-input-masked" required
placeholder="HH:MM" maxlength="5" value="${datos.fin || ''}"
onblur="applyTimeMask(this, '${finId}');">
<span id="${finId}" class="time-display"></span>
</div>
</div>
<label style="margin-top:5px;">Motivo:</label>
<select id="${motivoSelectId}" required onchange="guardarProgreso()">
<option value="">Seleccione</option>
<option value="cargue" ${datos.motivo === 'cargue' ? 'selected' : ''}>Cargue</option>
<option value="descargue" ${datos.motivo === 'descargue' ? 'selected' : ''}>Descargue</option>
<option value="otro" ${datos.motivo === 'otro' ? 'selected' : ''}>Otro</option>
</select>
<input type="text" placeholder="Especifique otro motivo" class="otro-input" value="${datos.otro_motivo || ''}">
</div>
<hr style="margin-top:25px; border-style:dashed;">
<label>Muelle:</label>
<select required onchange="guardarProgreso()">
<option value="">Seleccione</option>
<option value="3" ${datos.muelle === '3' ? 'selected' : ''}>3</option>
<option value="11" ${datos.muelle === '11' ? 'selected' : ''}>11</option>
<option value="12" ${datos.muelle === '12' ? 'selected' : ''}>12</option>
<option value="13" ${datos.muelle === '13' ? 'selected' : ''}>13</option>
<option value="14" ${datos.muelle === '14' ? 'selected' : ''}>14</option>
<option value="17" ${datos.muelle === '17' ? 'selected' : ''}>17</option>
<option value="18" ${datos.muelle === '18' ? 'selected' : ''}>18</option>
<option value="19" ${datos.muelle === '19' ? 'selected' : ''}>19</option>
<option value="20" ${datos.muelle === '20' ? 'selected' : ''}>20</option>
<option value="otro" ${datos.muelle === 'otro' ? 'selected' : ''}>Otro</option>
</select>
<input type="number" id="otro_muelle_${vIndex}" class="otro-input" placeholder="N° muelle" min="1" max="999" value="${datos.otro_muelle_num || ''}">
<label>Placa:</label>
<input type="text" required placeholder="Ej: ABC123, 123ABC o A12345" maxlength="6"
value="${datos.placa || ''}"
oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0,6); guardarProgreso();">
<label>Tipo De Vehiculo:</label>
<select required id="tipo_vehi_${vIndex}" onchange="guardarProgreso()">
<option value="">Seleccione</option>
<option value="Van extralargo" ${datos.tipo_vehi === 'Van extralargo' ? 'selected' : ''}>Van extralargo</option>
<option value="Camion sencillo furgonado" ${datos.tipo_vehi === 'Camion sencillo furgonado' ? 'selected' : ''}>Camión sencillo furgonado</option>
<option value="Camabaja furgonado" ${datos.tipo_vehi === 'Camabaja furgonado' ? 'selected' : ''}>Camabaja furgonado</option>
<option value="Tractomula furgonado" ${datos.tipo_vehi === 'Tractomula furgonado' ? 'selected' : ''}>Tractomula furgonado</option>
<option value="Exportacion 35" ${datos.tipo_vehi === 'Exportacion 35' ? 'selected' : ''}>Exportacion 35</option>
<option value="Exportacion 40" ${datos.tipo_vehi === 'Exportacion 40' ? 'selected' : ''}>Exportacion 40</option>
<option value="Cama baja con topes" ${datos.tipo_vehi === 'Cama baja con topes' ? 'selected' : ''}>Cama baja con topes</option>
<option value="Camion sencillo carpado" ${datos.tipo_vehi === 'Camion sencillo carpado' ? 'selected' : ''}>Camión Sencillo Carpado</option>
<option value="Camabaja estandar" ${datos.tipo_vehi === 'Camabaja estandar' ? 'selected' : ''}>Camabaja estandar</option>
<option value="otro" ${datos.tipo_vehi === 'otro' ? 'selected' : ''}>Otro</option>
</select>
<input type="text" id="otro_tipo_${vIndex}" class="otro-input" placeholder="Especifique tipo" value="${datos.otro_tipo || ''}">
<div class="form-group-custom" id="destino-group-${vIndex}" style="${(datos.motivo === 'cargue') ? 'display:block;' : 'display:none;'}">
<label style="margin-top:0;">Destino:</label>
<select id="destino-select-${vIndex}" onchange="guardarProgreso()">
<option value="">Seleccione Destino</option>
<option value="guarner_medellin" ${datos.destino === 'guarner_medellin' ? 'selected' : ''}>Guarne/Medellin</option>
<option value="cali" ${datos.destino === 'cali' ? 'selected' : ''}>Cali</option>
<option value="barranquilla" ${datos.destino === 'barranquilla' ? 'selected' : ''}>Barranquilla</option>
<option value="pereira" ${datos.destino === 'pereira' ? 'selected' : ''}>Pereira</option>
<option value="bucaramanga" ${datos.destino === 'bucaramanga' ? 'selected' : ''}>Bucaramanga</option>
<option value="monteria" ${datos.destino === 'monteria' ? 'selected' : ''}>Montería</option>
<option value="peru" ${datos.destino === 'peru' ? 'selected' : ''}>Perú</option>
<option value="otro" ${datos.destino === 'otro' ? 'selected' : ''}>Otro</option>
</select>
<input type="text" id="otro_destino_${vIndex}" class="otro-input" placeholder="Especifique otro destino" value="${datos.otro_destino || ''}">
</div>
<div class="form-group-custom" id="remitente-group-${vIndex}" style="${(datos.motivo === 'descargue') ? 'display:block;' : 'display:none;'}">
<label style="margin-top:0;">Origen / Remitente:</label>
<input type="text" id="remitente-input-${vIndex}" placeholder="Ej: Zona Franca" value="${datos.origen || ''}" oninput="guardarProgreso()">
</div>
<label>Total De Personas:</label>
<input type="number" min="1" required value="${datos.personas || ''}" oninput="guardarProgreso()">
<label>Cajas Movidas:</label>
<input type="number" class="cajas-input-js" min="0" required
value="${datos.cajas || ''}"
oninput="actualizarTotalCajas(); guardarProgreso();">
<label>Justificación del retraso o incidencia:</label>
<select onchange="guardarProgreso()">
<option value="">Seleccione motivo</option>
<option value="faltante_producto" ${datos.justificacion === 'faltante_producto' ? 'selected' : ''}>Faltante de producto</option>
<option value="otro" ${datos.justificacion === 'otro' ? 'selected' : ''}>Otro</option>
</select>
<input type="text" id="otro_justificacion_${vIndex}" class="otro-input" placeholder="Especifique la incidencia" value="${datos.otro_justificacion || ''}">
<label>Foto De vehiculo:</label>
<input type="file" id="${fotoInputId}" accept="image/*" capture="environment">
<div class="preview-foto" id="${previewFotoId}"></div>
<input type="hidden" value="${datos.foto_url || ''}">
<p style="font-size:0.85em; color:#6c757d; margin-top:5px;">
📸 <strong>La foto se sube automáticamente.</strong> No necesita hacer nada más.
</p>
`;
  registro.innerHTML = html;
  contenedor.appendChild(registro);

  if (datos.muelle === 'otro') document.getElementById(`otro_muelle_${vIndex}`).style.display = 'block';
  if (datos.tipo_vehi === 'otro') document.getElementById(`otro_tipo_${vIndex}`).style.display = 'block';
  if (datos.destino === 'otro') document.getElementById(`otro_destino_${vIndex}`).style.display = 'block';
  if (datos.justificacion === 'otro') document.getElementById(`otro_justificacion_${vIndex}`).style.display = 'block';

  const motivoSelect = document.getElementById(motivoSelectId);
  motivoSelect.addEventListener('change', () => {
    alternarDestinoRemitente(motivoSelect, vIndex);
    manejarOtroCampo(motivoSelect, null);
    guardarProgreso();
  });
  alternarDestinoRemitente(motivoSelect, vIndex);

  setupFotoPreview(fotoInputId, previewFotoId, nombrePersonalizado);

  if (datos.foto_url) {
    const preview = document.getElementById(previewFotoId);
    if (preview) preview.innerHTML = `<img src="${datos.foto_url}" alt="Vista previa">`;
  }
}

function agregarCampoParada(tipo) {
  const contenedor = document.getElementById('operacion-contenedor');
  const index = contenedor.children.length;
  const div = document.createElement('div');
  div.className = 'parada-group';
  div.dataset.index = index;

  const botonEliminar = document.createElement('button');
  botonEliminar.type = 'button';
  botonEliminar.className = 'btn-eliminar';
  botonEliminar.textContent = 'Eliminar';
  botonEliminar.onclick = function() {
    div.remove();
    const paradas = contenedor.getElementsByClassName('parada-group');
    for (let i = 0; i < paradas.length; i++) {
      const span = paradas[i].querySelector('.numero-parada');
      if (span) span.textContent = i + 1;
    }
    guardarProgreso();
  };

  div.innerHTML = `
<p style="font-weight:bold; margin-top:0; color:#555;">🛑 Parada #<span class="numero-parada">${index + 1}</span> (Operación)</p>
<div class="time-row">
<div>
<label class="time-label">Hora Inicio (HH:MM):</label>
<input type="tel" class="time-input-masked"
placeholder="HH:MM" maxlength="5"
onblur="applyTimeMask(this);">
<span class="time-display"></span>
</div>
<div>
<label class="time-label">Hora Final (HH:MM):</label>
<input type="tel" class="time-input-masked"
placeholder="HH:MM" maxlength="5"
onblur="applyTimeMask(this);">
<span class="time-display"></span>
</div>
</div>
<label style="margin-top:5px;">Motivo:</label>
<select onchange="manejarOtroCampo(this); guardarProgreso();">
<option value="">Seleccione</option>
<option value="pausas_activas">Pausas Activas y/o Charla</option>
<option value="liberacion_calidad">Liberacion De Calidad</option>
<option value="desayuno_almuerzo_cena">Desayuno/Almuerzo/Cena</option>
<option value="aseo">Aseo</option>
<option value="faltante_insumos">Faltante (Canastillas, vinipel, estibas, etc)</option>
<option value="danos_equipo">Daños (Electricos, montacargas, etc)</option>
<option value="otro">Otro</option>
</select>
<input type="text" placeholder="Especifique" class="otro-input" oninput="guardarProgreso()">
`;
  div.appendChild(botonEliminar);
  contenedor.appendChild(div);
  guardarProgreso();
}

function setupFotoPreview(inputId, previewId, nombrePersonalizado) {
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  if (!input || !preview) return;

  input.addEventListener('change', async function() {
    const file = this.files[0];
    if (!file || !file.type.match('image.*') || file.size > 5 * 1024 * 1024) {
      this.value = '';
      preview.innerHTML = '';
      if (file && !file.type.match('image.*')) alert('Solo imágenes (JPG/PNG).');
      if (file && file.size > 5 * 1024 * 1024) alert('Máx. 5 MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = e => preview.innerHTML = `<img src="${e.target.result}" alt="Vista previa">`;
    reader.readAsDataURL(file);

    const formData = new FormData();
    formData.append('image', file);
    formData.append('key', '7aa1cd8e8d0a3558833f225cbeba96ac');
    formData.append('name', nombrePersonalizado);

    try {
      const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
      const data = await response.json();
      if (data.success) {
        const imageUrl = data.data.url;
        const vIdx = parseInt(nombrePersonalizado.split('.').pop().replace('vehiculo_', ''), 10);
        if (vehiculosData[vIdx]) {
          vehiculosData[vIdx].foto_url = imageUrl;
        }
        alert(`✅ Foto subida: ${nombrePersonalizado}`);
        guardarProgreso();
      } else {
        throw new Error(data.error.message || 'Error al subir la foto');
      }
    } catch (error) {
      alert("❌ No se pudo subir la foto.");
      console.error(error);
    }
  });
}

function actualizarCampos() {
  const lugar = document.getElementById("lugar").value;
  const coord = document.getElementById("coordinador");
  const turno = document.getElementById("turno");
  const liderPepsico = document.getElementById("lider_pepsico");
  const fechaInput = document.getElementById("fecha");

  if (lugar === "Funza") {
    coord.value = "Jeison Aranda";
    const h = new Date().getHours();
    turno.value = (h >= 6 && h < 14) ? "Manana" : (h >= 14 && h < 22) ? "Tarde" : "Noche";
    if (!liderPepsico.dataset.manualChange) {
      liderPepsico.value = "Alejandro Monroy";
    }
  } else {
    coord.value = "";
    if (!liderPepsico.dataset.manualChange) liderPepsico.value = "";
  }

  if (!fechaInput.value) fechaInput.value = new Date().toISOString().split('T')[0];
  actualizarTotalCajas();
  guardarProgreso();
}

function manejarOtroCampo(select, otroId) {
  const otro = otroId ? document.getElementById(otroId) : select.nextElementSibling;
  if (!otro) return;
  if (select.value === 'otro') {
    otro.style.display = 'block';
    otro.required = true;
  } else {
    otro.style.display = 'none';
    otro.required = false;
    otro.value = '';
  }
}

function alternarDestinoRemitente(selectMotivo, vIndex) {
  const motivo = selectMotivo.value;
  const destinoGroup = document.getElementById(`destino-group-${vIndex}`);
  const remitenteGroup = document.getElementById(`remitente-group-${vIndex}`);
  if(destinoGroup) destinoGroup.style.display = motivo === 'cargue' ? 'block' : 'none';
  if(remitenteGroup) remitenteGroup.style.display = motivo === 'descargue' ? 'block' : 'none';

  const destinoSelect = document.getElementById(`destino-select-${vIndex}`);
  const remitenteInput = document.getElementById(`remitente-input-${vIndex}`);
  if (motivo === 'cargue' && destinoSelect) {
    destinoSelect.setAttribute('required', 'required');
  } else if (motivo === 'descargue' && remitenteInput) {
    remitenteInput.setAttribute('required', 'required');
  }
}

function applyTimeMask(input, displayId) {
  let value = input.value.replace(/[^0-9]/g, '');
  if (value.length === 1 && value > '2') value = '0' + value;
  if (value.length === 2 && value > '23') value = '23';
  if (value.length === 3 && value[2] > '5') value = value.substring(0,2) + '5';
  if (value.length >= 4) {
    value = value.substring(0,4).padStart(4,'0');
    let m = value.substring(2,4);
    if (m > '59') m = '59';
    value = value.substring(0,2) + m;
  }
  let formatted = value.length >= 2 ? value.substring(0,2) + ':' + (value.length > 2 ? value.substring(2,4) : '00') : '';
  input.value = formatted;
  convertirHoraMilitar(input, displayId);
  guardarProgreso();
}

function convertirHoraMilitar(input, displayId) {
  const value = input.value;
  const display = document.getElementById(displayId);
  if (!display) return;
  if (value.length === 5 && value.includes(':')) {
    const [h, m] = value.split(':').map(Number);
    if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
      const ampm = h >= 12 ? 'P.M.' : 'A.M.';
      const h12 = (h % 12) || 12;
      display.style.color = '#155724';
      display.innerHTML = `Hora Normal: ${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
      return;
    }
  }
  display.style.color = value.length > 0 && value.length < 5 ? '#dc3545' : '#155724';
  display.innerHTML = value.length > 0 && value.length < 5 ? '❌ Formato incompleto. HH:MM' : '';
}

function actualizarTotalCajas() {
  const camposCajas = document.querySelectorAll('.cajas-input-js');
  const totalCajasInput = document.getElementById('cajas_totales');
  let total = 0;
  camposCajas.forEach(input => {
    const valor = parseInt(input.value, 10);
    if (!isNaN(valor)) total += valor;
  });
  if(totalCajasInput) totalCajasInput.value = total;
}

function convertirATextoMayusculas() {
  const textInputs = document.querySelectorAll('input[type="text"], textarea');
  textInputs.forEach(input => {
    if (input.value.trim() !== '') input.value = input.value.toUpperCase();
  });
}

function guardarProgreso() {
  localStorage.setItem('pepsico_vehiculosData', JSON.stringify(vehiculosData));

  const paradas = [];
  const grupos = document.querySelectorAll('#operacion-contenedor .parada-group');
  grupos.forEach(grupo => {
    const telInputs = grupo.querySelectorAll('input[type="tel"]');
    const select = grupo.querySelector('select');
    const otroInput = grupo.querySelector('.otro-input');
    paradas.push({
      inicio: telInputs[0]?.value || '',
      fin: telInputs[1]?.value || '',
      motivo: select?.value || '',
      otro_motivo: otroInput?.value || ''
    });
  });
  localStorage.setItem('pepsico_paradasOperacion', JSON.stringify(paradas));

  ['lugar', 'lider', 'coordinador', 'lider_pepsico', 'fecha', 'turno', 'total_personas', 'cajas_totales'].forEach(key => {
    const el = document.getElementById(key);
    if (el) localStorage.setItem(`pepsico_${key}`, el.value);
  });
}

function sincronizarVehiculosData() {
  const cont = document.getElementById('vehiculos-contenedor');
  const registros = cont.querySelectorAll('.registro-vehiculo');
  for (let i = 0; i < registros.length; i++) {
    const reg = registros[i];
    const selects = reg.querySelectorAll('select');
    const inputs = reg.querySelectorAll('input[type="text"], input[type="number"]');
    const telInputs = reg.querySelectorAll('input[type="tel"]');
    const otroInputs = reg.querySelectorAll('.otro-input');

    const motivoSelect = selects[0];
    const muelleSelect = selects[1];
    const tipoVehiSelect = selects[2];
    const destinoSelect = selects[3];
    const justificacionSelect = selects[4];

    const otroMuelleInput = reg.querySelector('input[id^="otro_muelle_"]');
    const otroTipoInput = reg.querySelector('input[id^="otro_tipo_"]');
    const otroDestinoInput = reg.querySelector('input[id^="otro_destino_"]');
    const otroJustificacionInput = reg.querySelector('input[id^="otro_justificacion_"]');
    const remitenteInput = reg.querySelector('[id^="remitente-input-"]');
    const placaInput = reg.querySelector('input[type="text"][maxlength="6"]');
    const cajasInput = reg.querySelector('.cajas-input-js');
    const personasInput = reg.querySelector('input[type="number"][min="1"]');

    vehiculosData[i] = {
      inicio: telInputs[0]?.value || '',
      fin: telInputs[1]?.value || '',
      motivo: motivoSelect?.value || '',
      otro_motivo: motivoSelect?.value === 'otro' ? otroInputs[0]?.value || '' : '',
      muelle: muelleSelect?.value || '',
      otro_muelle_num: muelleSelect?.value === 'otro' ? otroMuelleInput?.value || '' : '',
      placa: placaInput?.value || '',
      tipo_vehi: tipoVehiSelect?.value || '',
      otro_tipo: tipoVehiSelect?.value === 'otro' ? otroTipoInput?.value || '' : '',
      destino: destinoSelect?.value || '',
      otro_destino: destinoSelect?.value === 'otro' ? otroDestinoInput?.value || '' : '',
      origen: remitenteInput?.value || '',
      personas: personasInput?.value || '',
      cajas: cajasInput?.value || '',
      justificacion: justificacionSelect?.value || '',
      otro_justificacion: justificacionSelect?.value === 'otro' ? otroJustificacionInput?.value || '' : '',
      foto_url: vehiculosData[i]?.foto_url || ''
    };
  }
}

function limpiarTodo() {
  if (confirm("¿Estás seguro de borrar toda la información?")) {
    localStorage.removeItem('pepsico_vehiculosData');
    localStorage.removeItem('pepsico_paradasOperacion');
    ['lugar', 'lider', 'coordinador', 'lider_pepsico', 'fecha', 'turno', 'total_personas', 'cajas_totales'].forEach(key => {
      localStorage.removeItem(`pepsico_${key}`);
    });
    location.reload();
  }
}

// ✅ FUNCIÓN DE ENVÍO DINÁMICA (sin campos fijos)
function enviarFormulario(event) {
  event.preventDefault();

  const form = event.target;
  const camposObligatorios = [
    { id: 'lugar', nombre: 'Lugar de operación' },
    { id: 'lider', nombre: 'Líder Asignado' },
    { id: 'lider_pepsico', nombre: 'Líder De Pepsico' },
    { id: 'fecha', nombre: 'Fecha' },
    { id: 'turno', nombre: 'Turno' },
    { id: 'total_personas', nombre: 'Total Personas En El Turno' },
    { id: 'cajas_totales', nombre: 'Total Cajas Movidas' }
  ];

  for (const campo of camposObligatorios) {
    const valor = document.getElementById(campo.id).value.trim();
    if (!valor) {
      alert(`❌ Por favor, complete el campo: "${campo.nombre}".`);
      return;
    }
  }

  if (!validarSolapamientoVehiculos() || !validarSolapamientoParadas()) return;

  // Sincronizar datos actuales
  sincronizarVehiculosData();

  // ✅ Eliminar campos dinámicos previos (por si hay reenvío)
  form.querySelectorAll('input[name^="vehiculo_"], input[name^="parada_cargue_"], input[name^="parada_operacion_"]').forEach(el => el.remove());

  // ✅ Agregar campos dinámicos para vehículos
  vehiculosData.forEach((veh, i) => {
    const camposVehiculo = {
      muelle: veh.muelle,
      placa: veh.placa,
      tipo_vehi: veh.tipo_vehi,
      destino: veh.destino,
      origen: veh.origen,
      personas: veh.personas,
      cajas_movidas: veh.cajas,
      foto_url: veh.foto_url
    };
    for (const [campo, valor] of Object.entries(camposVehiculo)) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = `vehiculo_${i}_${campo}`;
      input.value = valor || '';
      form.appendChild(input);
    }

    const paradaCargue = {
      hora_inicio: veh.inicio,
      hora_fin: veh.fin,
      motivo: veh.motivo,
      otro_motivo: veh.otro_motivo
    };
    for (const [campo, valor] of Object.entries(paradaCargue)) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = `parada_cargue_${i}_${campo}`;
      input.value = valor || '';
      form.appendChild(input);
    }
  });

  // ✅ Agregar campos dinámicos para paradas de operación
  const gruposParadas = document.querySelectorAll('#operacion-contenedor .parada-group');
  gruposParadas.forEach((grupo, i) => {
    const telInputs = grupo.querySelectorAll('input[type="tel"]');
    const select = grupo.querySelector('select');
    const otroInput = grupo.querySelector('.otro-input');
    const campos = {
      hora_inicio: telInputs[0]?.value || '',
      hora_fin: telInputs[1]?.value || '',
      motivo: select?.value || '',
      otro_motivo: otroInput?.value || ''
    };
    for (const [campo, valor] of Object.entries(campos)) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = `parada_operacion_${i}_${campo}`;
      input.value = valor || '';
      form.appendChild(input);
    }
  });

  convertirATextoMayusculas();
  localStorage.removeItem('pepsico_vehiculosData');
  localStorage.removeItem('pepsico_paradasOperacion');
  ['lugar', 'lider', 'coordinador', 'lider_pepsico', 'fecha', 'turno', 'total_personas', 'cajas_totales'].forEach(key => {
    localStorage.removeItem(`pepsico_${key}`);
  });

  alert('✅ ¡Formulario enviado correctamente!');
  form.submit(); // ✅ Netlify recibirá solo los campos que existan
}

// ✅ CARGA INICIAL
document.addEventListener('DOMContentLoaded', function() {
  const form = document.querySelector('form');

  const savedVehiculos = localStorage.getItem('pepsico_vehiculosData');
  if (savedVehiculos) {
    vehiculosData = JSON.parse(savedVehiculos);
  } else {
    vehiculosData = [];
    agregarRegistroVehiculo();
  }

  const contVeh = document.getElementById('vehiculos-contenedor');
  contVeh.innerHTML = '';
  vehiculosData.forEach((datos, idx) => {
    crearVehiculoHTML(contVeh, idx, datos);
  });

  const savedParadas = localStorage.getItem('pepsico_paradasOperacion');
  const contPar = document.getElementById('operacion-contenedor');
  contPar.innerHTML = '';
  if (savedParadas) {
    const paradas = JSON.parse(savedParadas);
    paradas.forEach(parada => {
      agregarCampoParada('operacion');
      const grupo = contPar.lastElementChild;
      if (grupo) {
        const telInputs = grupo.querySelectorAll('input[type="tel"]');
        const select = grupo.querySelector('select');
        const otroInput = grupo.querySelector('.otro-input');
        if (telInputs[0]) telInputs[0].value = parada.inicio;
        if (telInputs[1]) telInputs[1].value = parada.fin;
        if (select) {
          select.value = parada.motivo;
          if (parada.motivo === 'otro' && otroInput) {
            otroInput.style.display = 'block';
            otroInput.value = parada.otro_motivo;
          }
        }
        if (telInputs[0].value) applyTimeMask(telInputs[0], telInputs[0].nextElementSibling?.id || '');
        if (telInputs[1].value) applyTimeMask(telInputs[1], telInputs[1].nextElementSibling?.id || '');
      }
    });
  } else {
    agregarCampoParada('operacion');
  }

  ['lugar', 'lider', 'coordinador', 'lider_pepsico', 'fecha', 'turno', 'total_personas', 'cajas_totales'].forEach(key => {
    const saved = localStorage.getItem(`pepsico_${key}`);
    const el = document.getElementById(key);
    if (el && saved) el.value = saved;
  });

  form.addEventListener('submit', enviarFormulario);
  form.addEventListener('input', function() {
    ['lugar', 'lider', 'coordinador', 'lider_pepsico', 'fecha', 'turno', 'total_personas', 'cajas_totales'].forEach(key => {
      const el = document.getElementById(key);
      if (el) localStorage.setItem(`pepsico_${key}`, el.value);
    });
    guardarProgreso();
  });

  if (document.getElementById('lugar').value === 'Funza') {
    actualizarCampos();
  }
});
</script>
