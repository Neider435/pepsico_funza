<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Pepsico Funza</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 40px;
        }
        .logo-container {
            position: absolute;
            top: 50px;
            left: 50px;
        }
        .logo-container img {
            width: 200px;
            height: auto;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 500px;
            margin: auto;
        }
        .registro-vehiculo {
            border: 2px solid #C76E00;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            position: relative;
        }
        .parada-group {
            border: 1px dashed #ced4da;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
        }
        .form-group-custom { 
            margin-top: 15px;
            display: flex;
            flex-direction: column;
        }
        .btn-agregar-registro,
        .btn-agregar-parada-op {
            background-color: #001855;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-agregar-registro:hover,
        .btn-agregar-parada-op:hover {
            background-color: #0056b3;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        select, input, button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #170303;
        }
        .time-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .time-row > div {
            flex-grow: 1;
            position: relative;
        }
        .time-display {
            display: block;
            margin-top: 5px;
            font-size: 0.85em;
            color: #155724;
            font-weight: bold;
        }
        .time-label {
            font-weight: bold;
            display: block;
            margin-top: 5px;
            color: #007bff;
        }
        button[type="submit"] {
            background-color: #001855;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        .time-input-masked {
            text-align: center;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        .btn-eliminar {
            background-color:#8B0000 !important;
            width:auto !important;
            padding:5px 10px !important;
            margin-top:10px !important;
            border: none !important;
            color: white !important;
        }
        .btn-eliminar-registro {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #8B0000 !important;
            color: white !important;
            border: none !important;
            padding: 5px 10px !important;
            cursor: pointer;
            font-size: 0.8em;
            width: auto;
        }
        .btn-eliminar:hover {
            background-color:#c82333 !important;
        }
        .otro-input {
            margin-top:5px;
            display:none;
        }
        .preview-foto img {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 8px;
        }
        .btn-borrar-todo {
            background-color: #8B0000;
            color: white;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="prueba.png" alt="Logo de la Empresa"> 
    </div>
    <h2 style="text-align:center;">FORMULARIO - PEPSICO FUNZA</h2>

    <form name="formulario-pepsico" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="formulario-pepsico" />

        <label for="lugar">Lugar de operación:</label>
        <select name="lugar" id="lugar" required onchange="actualizarCampos()">
            <option value="">Seleccione una opción</option>
            <option value="Funza">Pepsico Funza</option>
        </select>

        <label for="lider">Líder Asignado:</label>
        <input type="text" name="lider_asignado" id="lider" required placeholder="Primer Nombre y Primer Apellido">

        <label for="coordinador">Coordinador Asignado:</label>
        <input type="text" name="coordinador" id="coordinador" readonly required>

        <label for="lider_pepsico">Líder De Pepsico:</label>
        <select name="lider_pepsico" id="lider_pepsico" required>
            <option value="">Seleccione un líder</option>
            <option value="Alejandro Ariza">Alejandro Ariza</option>
            <option value="Alejandro Monroy">Alejandro Monroy</option>
            <option value="Carlos Ruiz">Carlos Ruiz</option>
        </select>

        <label for="fecha">Fecha:</label>
        <input type="date" name="fecha" id="fecha" required>

        <label for="turno">Turno Asignado:</label>
        <select name="turno" id="turno" required>
            <option value="">Seleccione un turno</option>
            <option value="Manana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
        </select>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.3em; color:#C76E00;">REGISTRO DE VEHÍCULOS</h3>
        <div id="vehiculos-contenedor"></div>
        <button type="button" class="btn-agregar-registro" onclick="agregarRegistroVehiculo()">
            + Registrar Nuevo Vehículo
        </button>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.3em; color:#001855;">PARADAS DE OPERACIÓN</h3>
        <div id="operacion-contenedor"></div>
        <button type="button" class="btn-agregar-parada-op" onclick="agregarCampoParada('operacion')">
            + Agregar Parada
        </button>

        <hr style="margin-top: 25px; border-style: dotted;">
        <h3 style="text-align:center; font-size:1.1em; color:#296097;">TOTALES DE TURNO</h3>
        <label for="total_personas">Total Personas En El Turno:</label>
        <input type="number" name="total_personas" id="total_personas" min="1" required placeholder="Total de empleados en el turno">
        
        <label for="cajas_totales">Total Cajas Movidas:</label>
        <input type="number" name="cajas_totales" id="cajas_totales" min="0" required placeholder="Cantidad total de cajas movidas" oninput="actualizarTotalCajas()">
        
        <input type="hidden" name="datos_vehiculos" id="datos_vehiculos" value="">
        <input type="hidden" name="datos_paradas_operacion" id="datos_paradas_operacion" value="">

        <div style="display: flex; gap: 10px;">
            <button type="submit" style="flex: 3;">Enviar</button>
            <button type="button" class="btn-borrar-todo" style="flex: 1;" onclick="limpiarTodo()">Borrar Todo</button>
        </div>
    </form>

    <script>
        let vehiculosData = [];

        function horaAMinutos(horaStr) {
            if (!horaStr || !horaStr.includes(':')) return null;
            const [h, m] = horaStr.split(':').map(Number);
            if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
            return h * 60 + m;
        }

        function rangosSeSolapan(inicio1, fin1, inicio2, fin2) {
            const i1 = horaAMinutos(inicio1);
            const f1 = horaAMinutos(fin1);
            const i2 = horaAMinutos(inicio2);
            const f2 = horaAMinutos(fin2);
            if (i1 === null || f1 === null || i2 === null || f2 === null) return false;
            return i1 < f2 && i2 < f1;
        }

        function validarSolapamientoVehiculos() {
            const agrupados = {};
            const regsVisibles = document.querySelectorAll('.registro-vehiculo');
            
            for (let i = 0; i < regsVisibles.length; i++) {
                const idx = regsVisibles[i].dataset.index;
                const muelleSelect = document.getElementsByName(`vehiculo_${idx}_muelle`)[0];
                const inicioInput = document.getElementsByName(`vehiculo_${idx}_inicio`)[0];
                const finInput = document.getElementsByName(`vehiculo_${idx}_fin`)[0];
                
                if (!muelleSelect || !inicioInput || !finInput) continue;
                
                const muelle = muelleSelect.value;
                const inicio = inicioInput.value;
                const fin = finInput.value;

                if (!muelle || !inicio || !fin) continue;
                if (!agrupados[muelle]) agrupados[muelle] = [];
                agrupados[muelle].push({ inicio, fin, idx: parseInt(idx) + 1 });
            }

            for (const muelle in agrupados) {
                const regs = agrupados[muelle];
                for (let i = 0; i < regs.length; i++) {
                    for (let j = i + 1; j < regs.length; j++) {
                        if (rangosSeSolapan(regs[i].inicio, regs[i].fin, regs[j].inicio, regs[j].fin)) {
                            alert(`¡Conflicto en muelle ${muelle}! Vehículos #${regs[i].idx} y #${regs[j].idx} se superponen.`);
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function validarSolapamientoParadas() {
            const paradas = [];
            const cont = document.getElementById('operacion-contenedor');
            const grupos = cont.querySelectorAll('.parada-group');
            grupos.forEach((grupo, idx) => {
                const inicio = grupo.querySelector(`input[name^="parada_inicio_operacion_"]`).value;
                const fin = grupo.querySelector(`input[name^="parada_fin_operacion_"]`).value;
                if (inicio && fin) paradas.push({ inicio, fin, idx });
            });
            for (let i = 0; i < paradas.length; i++) {
                for (let j = i + 1; j < paradas.length; j++) {
                    if (rangosSeSolapan(paradas[i].inicio, paradas[i].fin, paradas[j].inicio, paradas[j].fin)) {
                        alert(`¡Las paradas de operación #${i + 1} y #${j + 1} se superponen!`);
                        return false;
                    }
                }
            }
            return true;
        }

        function eliminarRegistroVehiculo(index) {
            if (document.querySelectorAll('.registro-vehiculo').length <= 1) {
                alert("Debe haber al menos un vehículo.");
                return;
            }
            const registro = document.querySelector(`.registro-vehiculo[data-index="${index}"]`);
            if (registro) registro.remove();
            actualizarTotalCajas();
            guardarProgreso();
        }

        function agregarRegistroVehiculo() {
            const contenedor = document.getElementById('vehiculos-contenedor');
            const vIndex = document.querySelectorAll('.registro-vehiculo').length;
            crearVehiculoHTML(contenedor, vIndex, {});
            actualizarTotalCajas();
            guardarProgreso();
        }

        function crearVehiculoHTML(contenedor, vIndex, datos = {}) {
            const inicioId = `cargue-inicio-${vIndex}`;
            const finId = `cargue-fin-${vIndex}`;
            const fotoInputId = `foto_vehiculo_${vIndex}`;
            const previewFotoId = `preview_foto_${vIndex}`;
            const motivoSelectId = `motivo-cargue-descargue-${vIndex}`;

            const registro = document.createElement('div');
            registro.className = 'registro-vehiculo';
            registro.dataset.index = vIndex;

            const html = `
                <button type="button" class="btn-eliminar-registro" onclick="eliminarRegistroVehiculo(${vIndex})">Eliminar Vehículo</button>
                <hr style="margin-top:25px; border-style:dashed;">
                <h4 style="text-align:center; color:#C76E00;">DATOS DEL VEHÍCULO</h4>
                <div class="parada-group">
                    <p style="font-weight:bold; margin-top:0; color:#555;">🛑 Tiempo de Operación</p>
                    <div class="time-row">
                        <div>
                            <label class="time-label">Hora Inicio:</label>
                            <input type="tel" name="vehiculo_${vIndex}_inicio" class="time-input-masked" required placeholder="HH:MM" maxlength="5" value="${datos.inicio || ''}" onblur="applyTimeMask(this, '${inicioId}');">
                            <span id="${inicioId}" class="time-display"></span>
                        </div>
                        <div>
                            <label class="time-label">Hora Final:</label>
                            <input type="tel" name="vehiculo_${vIndex}_fin" class="time-input-masked" required placeholder="HH:MM" maxlength="5" value="${datos.fin || ''}" onblur="applyTimeMask(this, '${finId}');">
                            <span id="${finId}" class="time-display"></span>
                        </div>
                    </div>
                    <label style="margin-top:5px;">Motivo:</label>
                    <select id="${motivoSelectId}" name="vehiculo_${vIndex}_motivo" required onchange="guardarProgreso()">
                        <option value="">Seleccione</option>
                        <option value="cargue" ${datos.motivo === 'cargue' ? 'selected' : ''}>Cargue</option>
                        <option value="descargue" ${datos.motivo === 'descargue' ? 'selected' : ''}>Descargue</option>
                        <option value="otro" ${datos.motivo === 'otro' ? 'selected' : ''}>Otro</option>
                    </select>
                </div>

                <label>Muelle:</label>
                <select name="vehiculo_${vIndex}_muelle" required onchange="guardarProgreso()">
                    <option value="">Seleccione</option>
                    <option value="3" ${datos.muelle === '3' ? 'selected' : ''}>3</option>
                    <option value="11" ${datos.muelle === '11' ? 'selected' : ''}>11</option>
                    <option value="12" ${datos.muelle === '12' ? 'selected' : ''}>12</option>
                    <option value="13" ${datos.muelle === '13' ? 'selected' : ''}>13</option>
                    <option value="14" ${datos.muelle === '14' ? 'selected' : ''}>14</option>
                    <option value="17" ${datos.muelle === '17' ? 'selected' : ''}>17</option>
                    <option value="18" ${datos.muelle === '18' ? 'selected' : ''}>18</option>
                    <option value="19" ${datos.muelle === '19' ? 'selected' : ''}>19</option>
                    <option value="20" ${datos.muelle === '20' ? 'selected' : ''}>20</option>
                    <option value="otro" ${datos.muelle === 'otro' ? 'selected' : ''}>Otro</option>
                </select>

                <label>Placa:</label>
                <input type="text" name="vehiculo_${vIndex}_placa" required placeholder="ABC123" maxlength="6" value="${datos.placa || ''}" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); guardarProgreso();">

                <label>Tipo De Vehiculo:</label>
                <select name="vehiculo_${vIndex}_tipo_vehi" required onchange="guardarProgreso()">
                    <option value="">Seleccione</option>
                    <option value="Van extralargo" ${datos.tipo_vehi === 'Van extralargo' ? 'selected' : ''}>Van extralargo</option>
                    <option value="Camion sencillo furgonado" ${datos.tipo_vehi === 'Camion sencillo furgonado' ? 'selected' : ''}>Camión sencillo furgonado</option>
                    <option value="Tractomula furgonado" ${datos.tipo_vehi === 'Tractomula furgonado' ? 'selected' : ''}>Tractomula furgonado</option>
                </select>

                <div class="form-group-custom" id="destino-group-${vIndex}">
                    <label style="margin-top:0;">Destino / Origen:</label>
                    <input type="text" name="vehiculo_${vIndex}_destino_origen" placeholder="Ciudad o Zona Franca" value="${datos.destino_origen || ''}">
                </div>

                <label>Personas Asignadas:</label>
                <input type="number" name="vehiculo_${vIndex}_personas" min="1" required value="${datos.personas || ''}" oninput="guardarProgreso()">

                <label>Cajas Movidas:</label>
                <input type="number" name="vehiculo_${vIndex}_cajas" class="cajas-input-js" min="0" required value="${datos.cajas || ''}" oninput="actualizarTotalCajas(); guardarProgreso();">

                <label>Foto De vehiculo:</label>
                <input type="file" id="${fotoInputId}" accept="image/*" capture="environment">
                <div class="preview-foto" id="${previewFotoId}"></div>
                <input type="hidden" name="vehiculo_${vIndex}_foto_url" id="foto_url_${vIndex}" value="${datos.foto_url || ''}">
            `;
            registro.innerHTML = html;
            contenedor.appendChild(registro);
            
            const fechaInput = document.getElementById('fecha').value || '01-01-2026';
            setupFotoPreview(fotoInputId, previewFotoId, `Vehiculo_${vIndex}_${fechaInput}`);
        }

        function agregarCampoParada(tipo) {
            const contenedor = document.getElementById('operacion-contenedor');
            const index = document.querySelectorAll('#operacion-contenedor .parada-group').length;
            const div = document.createElement('div');
            div.className = 'parada-group';

            div.innerHTML = `
                <p style="font-weight:bold; margin-top:0; color:#555;">🛑 Parada de Operación</p>
                <div class="time-row">
                    <div>
                        <label class="time-label">Inicio:</label>
                        <input type="tel" name="parada_inicio_operacion_${index}" class="time-input-masked" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'p-ini-${index}')">
                        <span id="p-ini-${index}" class="time-display"></span>
                    </div>
                    <div>
                        <label class="time-label">Final:</label>
                        <input type="tel" name="parada_fin_operacion_${index}" class="time-input-masked" placeholder="HH:MM" maxlength="5" onblur="applyTimeMask(this, 'p-fin-${index}')">
                        <span id="p-fin-${index}" class="time-display"></span>
                    </div>
                </div>
                <label style="margin-top:5px;">Motivo Parada:</label>
                <select name="parada_motivo_operacion_${index}" onchange="guardarProgreso()">
                    <option value="">Seleccione</option>
                    <option value="pausas_activas">Pausas Activas</option>
                    <option value="aseo">Aseo</option>
                    <option value="alimentacion">Desayuno/Almuerzo/Cena</option>
                    <option value="otro">Otro</option>
                </select>
                <button type="button" class="btn-eliminar" onclick="this.parentElement.remove(); guardarProgreso();">Eliminar Parada</button>
            `;
            contenedor.appendChild(div);
            guardarProgreso();
        }

        function setupFotoPreview(inputId, previewId, nombre) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            if (!input) return;
            input.addEventListener('change', async function() {
                const file = this.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = e => preview.innerHTML = `<img src="${e.target.result}">`;
                reader.readAsDataURL(file);

                const formData = new FormData();
                formData.append('image', file);
                formData.append('key', '7aa1cd8e8d0a3558833f225cbeba96ac');
                formData.append('name', nombre);

                try {
                    const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                    const resData = await response.json();
                    if (resData.success) {
                        const vIdx = inputId.replace('foto_vehiculo_', '');
                        document.getElementById(`foto_url_${vIdx}`).value = resData.data.url;
                        alert("✅ Foto cargada correctamente");
                    }
                } catch (err) { alert("❌ Error al subir foto"); }
            });
        }

        function actualizarCampos() {
            const lugar = document.getElementById("lugar").value;
            const coord = document.getElementById("coordinador");
            if (lugar === "Funza") {
                coord.value = "Jeison Aranda";
                const h = new Date().getHours();
                document.getElementById("turno").value = (h >= 6 && h < 14) ? "Manana" : (h >= 14 && h < 22) ? "Tarde" : "Noche";
            }
            if (!document.getElementById("fecha").value) document.getElementById("fecha").value = new Date().toISOString().split('T')[0];
            actualizarTotalCajas();
        }

        function applyTimeMask(input, displayId) {
            let val = input.value.replace(/\D/g, '');
            if (val.length >= 4) {
                let h = val.substring(0, 2);
                let m = val.substring(2, 4);
                if (parseInt(h) > 23) h = "23";
                if (parseInt(m) > 59) m = "59";
                input.value = h + ":" + m;
            }
            convertirHoraMilitar(input, displayId);
            guardarProgreso();
        }

        function convertirHoraMilitar(input, displayId) {
            const display = document.getElementById(displayId);
            if (!display) return;
            const val = input.value;
            if (val.length === 5) {
                const [h, m] = val.split(':').map(Number);
                const ampm = h >= 12 ? 'P.M.' : 'A.M.';
                const h12 = (h % 12) || 12;
                display.innerHTML = `Hora Normal: ${h12}:${m.toString().padStart(2, '0')} ${ampm}`;
            }
        }

        function actualizarTotalCajas() {
            let total = 0;
            document.querySelectorAll('.cajas-input-js').forEach(i => {
                total += parseInt(i.value) || 0;
            });
            document.getElementById('cajas_totales').value = total;
        }

        function guardarProgreso() {
            const form = document.forms[0];
            const data = {};
            const formData = new FormData(form);
            formData.forEach((value, key) => {
                if (!(value instanceof File)) data[key] = value;
            });
            data._numVehiculos = document.querySelectorAll('.registro-vehiculo').length;
            data._numParadas = document.querySelectorAll('#operacion-contenedor .parada-group').length;
            localStorage.setItem('pepsico_data', JSON.stringify(data));
        }

        function limpiarTodo() {
            if (confirm("¿Borrar todo?")) {
                localStorage.removeItem('pepsico_data');
                location.reload();
            }
        }

        function enviarFormulario(event) {
            event.preventDefault();

            // --- BLOQUE DE SOLUCIÓN PARA NETLIFY ---
            const vehiculos = [];
            document.querySelectorAll('.registro-vehiculo').forEach(reg => {
                const idx = reg.dataset.index;
                const v = {
                    placa: reg.querySelector(`input[name="vehiculo_${idx}_placa"]`)?.value,
                    muelle: reg.querySelector(`select[name="vehiculo_${idx}_muelle"]`)?.value,
                    cajas: reg.querySelector(`input[name="vehiculo_${idx}_cajas"]`)?.value,
                    foto: reg.querySelector(`input[name="vehiculo_${idx}_foto_url"]`)?.value
                };
                vehiculos.push(`Placa: ${v.placa}, Muelle: ${v.muelle}, Cajas: ${v.cajas}, Foto: ${v.foto}`);
            });
            document.getElementById('datos_vehiculos').value = vehiculos.join(" | ");

            const paradas = [];
            document.querySelectorAll('#operacion-contenedor .parada-group').forEach((p, i) => {
                const inicio = p.querySelector(`input[name="parada_inicio_operacion_${i}"]`)?.value;
                const fin = p.querySelector(`input[name="parada_fin_operacion_${i}"]`)?.value;
                const motivo = p.querySelector(`select[name="parada_motivo_operacion_${i}"]`)?.value;
                paradas.push(`${inicio}-${fin} (${motivo})`);
            });
            document.getElementById('datos_paradas_operacion').value = paradas.join(" | ");
            // --- FIN BLOQUE DE SOLUCIÓN ---

            if (!validarSolapamientoVehiculos()) return;
            if (!validarSolapamientoParadas()) return;

            localStorage.removeItem('pepsico_data');
            event.target.submit();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const saved = localStorage.getItem('pepsico_data');
            
            if (saved) {
                const data = JSON.parse(saved);
                const nVehiculos = data._numVehiculos || 0;
                for(let i=0; i<nVehiculos; i++) {
                    crearVehiculoHTML(document.getElementById('vehiculos-contenedor'), i, {
                        inicio: data[`vehiculo_${i}_inicio`],
                        fin: data[`vehiculo_${i}_fin`],
                        motivo: data[`vehiculo_${i}_motivo`],
                        muelle: data[`vehiculo_${i}_muelle`],
                        placa: data[`vehiculo_${i}_placa`],
                        tipo_vehi: data[`vehiculo_${i}_tipo_vehi`],
                        personas: data[`vehiculo_${i}_personas`],
                        cajas: data[`vehiculo_${i}_cajas`],
                        foto_url: data[`vehiculo_${i}_foto_url`]
                    });
                }
                const nParadas = data._numParadas || 0;
                for(let i=0; i<nParadas; i++) agregarCampoParada('operacion');

                Object.keys(data).forEach(key => {
                    const el = form.elements[key];
                    if (el && !key.startsWith('_')) {
                        el.value = data[key];
                        if (el.classList.contains('time-input-masked')) {
                            const spanId = el.nextElementSibling?.id;
                            if(spanId) applyTimeMask(el, spanId);
                        }
                    }
                });
            } else {
                agregarRegistroVehiculo();
                agregarCampoParada('operacion');
                actualizarCampos();
            }

            form.addEventListener('submit', enviarFormulario);
            form.addEventListener('input', guardarProgreso);
        });
    </script>
</body>
</html>
